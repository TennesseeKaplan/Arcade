<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ask the floating oracle above Tallahassee a question.">
<title>Tallahassee Magic 8-Ball</title>
<link rel="stylesheet" href="../shared/player/game-page.css">
<script type="module" src="../shared/player/game-page.js"></script>
<link rel="stylesheet" href="../shared/player/blueprint/components.css">
<link rel="stylesheet" href="../shared/player/layout.css">
<script type="module" src="../shared/player/layout.js"></script>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;background:#e6ece9;color:#193126}
:root.arcade-dark{color-scheme:dark;background:#091217;color:#edf4e7}
*{box-sizing:border-box}
body{margin:0}
main{width:min(100% - 2rem,58rem);margin:auto;padding:1rem 0 2rem}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.85rem}
h1{font:760 clamp(1.3rem,4vw,2.3rem)/1.08 system-ui;margin:0;color:var(--arcade-text)}
a{color:var(--oracle-link,#286449);text-underline-offset:.2em}
.scene{position:relative;overflow:hidden;border:1px solid #426755;border-radius:10px;background:#10312d}
.portrait{display:block;width:100%;height:auto;aspect-ratio:3 / 2}
#mouth{transform-box:view-box;transform-origin:294px 211px}
#mouth[hidden]{display:none}
#mouth-opening{transform-origin:294px 211px;transform:scaleY(.12)}
.talking #mouth-opening{animation:open-mouth 230ms ease-in-out 4}
.talking #jaw{animation:drop-jaw 230ms ease-in-out 4}
@keyframes open-mouth{0%,100%{transform:scaleY(.12)}38%{transform:scaleY(1)}68%{transform:scaleY(.66)}}
@keyframes drop-jaw{0%,100%{transform:translateY(0)}38%{transform:translateY(10px)}68%{transform:translateY(6px)}}
.header-controls{display:flex;align-items:center;gap:.8rem}
#mute{min-width:5.7rem;white-space:nowrap}
.scene::after {
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 25%,#7ff5ac66 39%,transparent 58%);
  mix-blend-mode:screen;
}
.scene.pulse::after{animation:mist-ripple .85s ease-out}
@keyframes mist-ripple {
  from{opacity:.7;transform:scale(.58)}
  to{opacity:0;transform:scale(1.48)}
}
#head-dim{opacity:0}
.scene.sleep #head-dim{animation:drowse .58s ease-in-out}
@keyframes drowse{46%{opacity:.66}82%{opacity:.13}}
.arcade-game-area,.arcade-controls-area{--arcade-line:#b6cdc0;--arcade-hud:#eaf5ed;--oracle-link:#286449}
.arcade-dark :is(.arcade-game-area,.arcade-controls-area){--arcade-panel:#12231e;--arcade-controls:#14251f;--arcade-line:#426755;--arcade-hud:#203b30;--oracle-link:#aee1ba}
.console{padding:clamp(.75rem,2vw,1.15rem)}
#oracle-result{padding:0 .25rem}
.arcade-theme-bar.header-controls{margin:0;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){header{flex-wrap:wrap}.header-controls{justify-content:flex-start!important}}
label{display:block;margin-bottom:.4rem;color:var(--arcade-text)}
.ask-row{display:flex;gap:.6rem}
input{min-width:0;flex:1;background:var(--arcade-panel);color:var(--arcade-text);border:1px solid var(--arcade-line);border-radius:.45rem;padding:.7rem;font:inherit;-webkit-user-select:text;user-select:text}
button{min-height:44px;background:#c2e5a8;color:#102018;border:0;border-radius:.45rem;padding:.55rem 1rem;font:700 1rem system-ui;cursor:pointer}
#ask{box-shadow:0 4px 0 #456045;transition:box-shadow .18s,transform .14s,background-color .18s}
#oracle.ready #ask{background:#d1efa9;box-shadow:0 4px 0 #456045,0 0 1rem #b2f79566}
#ask:active,#oracle.ready #ask:active{transform:translateY(3px);box-shadow:0 1px 0 #456045}
#answer.lit{animation:answer-light .52s ease-out}
@keyframes answer-light {
  from{text-shadow:0 0 1.25rem #ffc979cc;color:var(--arcade-text)}
  to{text-shadow:0 0 .25rem #ffc97900}
}
#video:not([hidden]) #load-video{animation:marquee-light .75s ease-out}
@keyframes marquee-light {
  from{box-shadow:0 0 1.1rem #ffc979bb,inset 0 0 .55rem #ffdb86}
  to{box-shadow:0 0 0 #ffc97900}
}
:focus-visible{outline:2px solid #ffdb86;outline-offset:3px}
#answer{font:700 clamp(1.25rem,3vw,1.85rem)/1.25 Georgia,serif;color:#724b20;margin:.75rem 0 0;min-height:1.3em}
.arcade-dark #answer{color:#f7e4b8}
#answer:empty{display:none}
#video{margin-top:1rem}
#video a{display:inline-block;margin-top:.7rem}
iframe{width:min(100%,36rem);border:0;aspect-ratio:16/9;display:block}
@media(max-width:560px){main{width:min(100% - 1rem,58rem)}header{align-items:center}.header-controls{gap:.5rem}#mute{min-width:4.5rem;padding:.55rem .65rem}}
@media(prefers-reduced-motion:reduce){
  .scene.pulse::after,.scene.sleep #head-dim,#answer.lit,#video:not([hidden]) #load-video{animation:none}
  #ask{transition:none}
  #ask:active,#oracle.ready #ask:active{transform:none}
}
</style>
</head>
<body>
<main>
<section class="bp5-card arcade-game-area" aria-label="Game Area">
<header><h1>Tallahassee Magic 8-Ball</h1><div class="header-controls arcade-theme-bar"><button type="button" class="bp5-button bp5-minimal arcade-theme-toggle" data-arcade-theme>Light Mode</button><button type="button" id="mute">Mute</button></div></header>
<audio id="theme" src="oracle-loop.m4a" loop preload="auto"></audio>
<div id="scene" class="scene">
<svg class="portrait" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A giant mustached head floating in green mist over Tallahassee and the Florida Capitol">
  <defs>
    <radialGradient id="drowse-shadow">
      <stop offset="0" stop-color="#040e19"/>
      <stop offset="1" stop-color="#040e19" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="jaw-mask"><path d="M263 212 Q293 205 325 213 L324 225 Q294 236 265 224Z"/></clipPath>
  </defs>
  <image href="oracle.webp" width="600" height="400"/>
  <g id="mouth" hidden>
    <path id="mouth-opening" d="M264 210 Q293 203 324 211 Q312 228 293 229 Q274 226 264 210Z" fill="#3b1c20"/>
    <g id="jaw"><image href="oracle.webp" width="600" height="400" clip-path="url(#jaw-mask)"/></g>
  </g>
  <ellipse id="head-dim" cx="298" cy="154" rx="112" ry="132" fill="url(#drowse-shadow)"/>
</svg>
</div>
<div id="oracle-result">
<p id="answer" role="status" aria-live="polite"></p>
<div id="video" hidden>
<button type="button" id="load-video">Play Video Here</button><br>
<a href="https://www.youtube.com/watch?v=HGV3yV9q4Q4" target="_blank" rel="noopener">Watch on YouTube</a>
</div>
</div>
</section>
<section class="bp5-card arcade-controls-area console" aria-label="Controls">
<form id="oracle">
<label for="question">Ask the Oracle</label>
<div class="ask-row"><input id="question" type="text" maxlength="500" required autocomplete="off" spellcheck="false" placeholder="What should I do?"><button type="submit" id="ask">Ask</button></div>
</form>
</section>
</main>
<script type="module">
const answers = [
  "I don't care man",
  "That's cool, have you heard of Delicate Steve?",
  "There's always a finesse to be had",
  "Sorry, fell asleep for a second there",
  "I know exactly what you are looking for",
  "Sounds like a YOU problem bud",
];

const cues = [
  [1, /\b(?:music|guitars?|bands?|concerts?|songs?|delicate steve)\b/],
  [2, /\b(?:how do i|how can i|advice|fix|repair|finesse)\b/],
  [4, /\b(?:where can i find|where do i find|show me|looking for|find me)\b/],
  [5, /\b(?:drama|blame|is it my fault|whose fault|my problem)\b/],
];

let rotation = [];
let previous;
function nextRandom() {
  if (!rotation.length) {
    rotation = answers.map((_, index) => index);
    for (let index = rotation.length - 1; index > 0; index--) {
      const swap = Math.floor(Math.random() * (index + 1));
      [rotation[index], rotation[swap]] = [rotation[swap], rotation[index]];
    }
    if (rotation.at(-1) === previous) [rotation[0], rotation[rotation.length - 1]] = [rotation.at(-1), rotation[0]];
  }
  return rotation.pop();
}
function chooseAnswer(question) {
  const normalized = question.toLowerCase().replace(/[^a-z0-9]+/g, ' ');
  const matches = cues.filter(([, cue]) => cue.test(normalized));
  return matches.length && Math.random() < .6
    ? matches[Math.floor(Math.random() * matches.length)][0]
    : nextRandom();
}

const form = document.querySelector('#oracle');
const input = document.querySelector('#question');
const scene = document.querySelector('#scene');
const answer = document.querySelector('#answer');
const video = document.querySelector('#video');
const loadVideo = document.querySelector('#load-video');
const theme = document.querySelector('#theme');
const mute = document.querySelector('#mute');
const mouth = document.querySelector('#mouth');

let muted = false;
try { muted = localStorage.getItem('tallahassee-muted') === 'true'; } catch {}
let voiceContext;
let voiceLevel;
let currentVoice;
let mouthTimer;

function startTheme() {
  if (!muted && theme.paused) theme.play().catch(() => {});
}
function updateMute() {
  mute.textContent = muted ? 'Unmute' : 'Mute';
  mute.setAttribute('aria-label', muted ? 'Unmute game audio' : 'Mute game audio');
  if (muted) theme.pause();
  else startTheme();
  if (voiceLevel) voiceLevel.gain.value = muted ? 0 : .20;
}
mute.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('tallahassee-muted', String(muted)); } catch {}
  updateMute();
});
document.addEventListener('click', event => {
  if (!event.target.closest('#mute')) startTheme();
});
updateMute();

function playWah() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext || muted) return;
  if (!voiceContext) {
    voiceContext = new AudioContext();
    voiceLevel = voiceContext.createGain();
    voiceLevel.gain.value = .20;
    voiceLevel.connect(voiceContext.destination);
  }
  if (voiceContext.state !== 'running') voiceContext.resume().catch(() => {});
  if (currentVoice) currentVoice.disconnect();
  const voice = voiceContext.createOscillator();
  const filter = voiceContext.createBiquadFilter();
  const envelope = voiceContext.createGain();
  voice.type = 'sawtooth';
  filter.type = 'bandpass';
  filter.Q.value = 1.8;
  voice.connect(filter).connect(envelope).connect(voiceLevel);
  currentVoice = voice;
  const start = voiceContext.currentTime;
  [146, 123, 137, 107].forEach((note, index) => {
    const at = start + index * .23;
    voice.frequency.setValueAtTime(note, at);
    voice.frequency.exponentialRampToValueAtTime(note * .80, at + .19);
    filter.frequency.setValueAtTime(380, at);
    filter.frequency.exponentialRampToValueAtTime(1050 - index * 105, at + .075);
    filter.frequency.exponentialRampToValueAtTime(375, at + .19);
    envelope.gain.setValueAtTime(0, at);
    envelope.gain.linearRampToValueAtTime(.8, at + .065);
    envelope.gain.linearRampToValueAtTime(0, at + .21);
  });
  voice.start(start);
  voice.stop(start + .92);
  voice.onended = () => { if (currentVoice === voice) currentVoice = null; };
}
function talk() {
  clearTimeout(mouthTimer);
  scene.classList.remove('talking');
  mouth.removeAttribute('hidden');
  void scene.offsetWidth;
  scene.classList.add('talking');
  mouthTimer = setTimeout(() => {
    scene.classList.remove('talking');
    mouth.setAttribute('hidden', '');
  }, 920);
  playWah();
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) {
    input.setCustomValidity('Enter a question first.');
    input.reportValidity();
    return;
  }
  startTheme();
  previous = chooseAnswer(question);
  answer.textContent = answers[previous];
  scene.classList.remove('pulse', 'sleep');
  answer.classList.remove('lit');
  video.hidden = true;
  void scene.offsetWidth;
  scene.classList.add('pulse');
  scene.classList.toggle('sleep', previous === 3);
  answer.classList.add('lit');
  video.querySelector('iframe')?.remove();
  video.hidden = previous !== 4;
  loadVideo.hidden = false;
  talk();
});
function updateAsk() {
  input.setCustomValidity('');
  form.classList.toggle('ready', input.value.trim().length > 0);
}
input.addEventListener('input', updateAsk);
window.addEventListener('pageshow', updateAsk);
updateAsk();

loadVideo.addEventListener('click', () => {
  const frame = document.createElement('iframe');
  frame.src = 'https://www.youtube-nocookie.com/embed/HGV3yV9q4Q4?autoplay=1';
  frame.title = 'The oracle’s YouTube recommendation';
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  video.prepend(frame);
  loadVideo.hidden = true;
});
</script>
</body>
</html>
