const W=384,H=216,driverY=166, aimHeight=11;

const keys=new Set(), touches=new Map(), configs=[

 {cars:5,foes:3,fire:1.4,chase:21,gap:.86}
];
let phase='title', level=0, carIndex=0, jack, bullets=[], foes=[], hazards=[], cover=[], carX=192, carHealth=3, crashTime=0, crashSide=1, chase=0, spawn=0, seed=1, shot=0, hit=0;
let previous=performance.now(), now=previous, sceneAt=previous, start=null, finish=null, retries=0, best=null;
try{const saved=Number(localStorage.getItem('desperados-best-wide-train'));if(saved>0)best=saved;}catch{}
const time=ms=>{const t=Math.max(0,Math.floor(ms));return Math.floor(t/60000)+':'+String(Math.floor(t/1000)%60).padStart(2,'0')+'.'+String(t%1000).padStart(3,'0');};
const elapsed=()=>start===null?0:(finish??performance.now())-start;
const down=k=>[...keys].some(code=>bindings[code]===k)||[...touches.values()].includes(k);

const poly=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();};
function scene(next){phase=next;sceneAt=performance.now();$('overlay').hidden=true;if(document.activeElement?.tagName==='BUTTON')document.activeElement.blur();}

function setupCar(index,hp=3){

const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const atCover=(x,y,pad=0)=>cover.some(r=>x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad);
function movement(){
 const x=Number(down('ArrowRight'))-Number(down('ArrowLeft'));
 const y=Number(down('ArrowDown'))-Number(down('ArrowUp'));
 const length=Math.hypot(x,y)||1;
 return [x/length,y/length];
}
function roundFrom(x,y,dx,dy,speed,ours){
 bullets.push({x:x+dx*9,y:y+dy*9,vx:dx*speed,vy:dy*speed,ours});
}
function updateTrain(dt,age,cfg){
 const [dx,dy]=movement();
 jack.moving=Boolean(dx||dy);
 if(jack.moving){jack.dx=dx;jack.dy=dy;}
 const x=clamp(jack.x+dx*118*dt,17,369);
 const y=clamp(jack.y+dy*118*dt,47,187);
 if(!atCover(x,jack.y,8))jack.x=x;
 if(!atCover(jack.x,y,8))jack.y=y;
 shot-=dt;hit-=dt;
 if(down('Space')&&shot<=0){
  roundFrom(jack.x,jack.y,jack.dx,jack.dy,260,true);
  shot=.23;
 }
 for(const foe of foes){
  if(age<foe.at)continue;
  const fx=jack.x-foe.x,fy=jack.y-foe.y,length=Math.hypot(fx,fy)||1;
  roundFrom(foe.x,foe.y,fx/length,fy/length,94+level*25,false);
  foe.at=age+cfg.fire;
 }
 for(const b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(atCover(b.x,b.y)){b.dead=true;continue;}
  if(b.ours){
   const index=foes.findIndex(f=>Math.hypot(f.x-b.x,f.y-b.y)<10);
   if(index>=0){foes.splice(index,1);b.dead=true;}
  }else if(hit<=0&&Math.hypot(jack.x-b.x,jack.y-b.y)<8){
   b.dead=true;hit=1;
   if(--jack.hp===0){retry('train');return;}
  }
 }
 bullets=bullets.filter(b=>!b.dead&&b.x>9&&b.x<375&&b.y>35&&b.y<196);
 if(jack.x>=364&&Math.abs(jack.y-118)<25&&!foes.length){

}
function setupChase(){carX=192;carHealth=3;crashTime=0;crashSide=1;chase=0;spawn=.75;hazards=[];seed=739+level*419;scene('drive');}
function retry(kind){retries++;scene(kind==='train'?'trainRetry':'driveRetry');modal(kind==='train'?'Jack is pinned down':'The getaway car is wrecked','Retry time counts toward your finish.','Retry',kind==='train'?()=>setupCar(0):setupChase);}
function complete(){finish=performance.now();const n=elapsed();if(best===null||n<best){best=n;try{localStorage.setItem('desperados-best-wide-train',String(n));}catch{}}scene('ending');}
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
function update(dt){
 const age=(now-sceneAt)/1000,cfg=configs[level];

 if(phase==='handoff'&&age>=5.5)setupChase();

 if(phase==='train')updateTrain(dt,age,cfg);
 if(phase==='drive'){
  crashTime=Math.max(0,crashTime-dt);
  if(carHealth===0){
   if(crashTime===0)retry('drive');
   return;
  }
  chase+=dt;
  const dx=Number(down('ArrowRight'))-Number(down('ArrowLeft'));
  carX=clamp(carX+(dx*153+(crashTime>0?crashSide*34:0))*dt,20,W-20);
  spawn-=dt;
  if(spawn<=0){
   const lane=Math.floor(random()*7);
   hazards.push({x:30+54*lane,y:-20,type:random()<.73?'cactus':'police',hit:false});
   if(level>0&&random()<.45)hazards.push({x:30+54*((lane+2)%7),y:-35,type:'cactus',hit:false});
   spawn=cfg.gap;
  }
  for(const obstacle of hazards){
   obstacle.y+=(91+level*16)*(obstacle.type==='police'?.8:1)*dt;
   if(obstacle.hit||Math.abs(obstacle.x-carX)>=17||Math.abs(obstacle.y-driverY)>=18)continue;
   obstacle.hit=true;
   if(crashTime>0)continue;
   carHealth--;
   crashTime=.68;
   crashSide=carX>=obstacle.x?1:-1;
   impactSound();
  }
  hazards=hazards.filter(obstacle=>obstacle.y<240);
  if(carHealth>0&&chase>=cfg.chase){
   if(level===2)complete();
   else{level++;scene('safe');}
  }
 }
}

const blues=[40,40,40,40,45,45,40,40,47,45,40,47];
const hook=[
 [[0,12],[.67,15],[1,16],[1.67,19],[3,19]],
 [[0,7],[.67,5],[1,3],[2,0]],
 [[0,12],[1,15],[1.33,16],[2.67,19]],
 [[1,7],[2,5],[3,3]],
 [[0,12],[.67,15],[1,16],[1.67,19]],
 [[0,7],[1,5],[2,3],[3,0]],
 [[0,12],[.67,15],[1,16],[2,19]],
 [[0,7],[1,5],[2,3],[3,0]],
 [[0,19],[1.67,16],[3,15]],
 [[0,12],[1.67,7],[3,5]],
 [[0,12],[.67,15],[1,16],[2,19]],
 [[0,7],[1,5],[2,3],[3,2]]
];
let sound=null, musicGain=null, nextBar=0, barIndex=0, musicOn=true;
function enableMusic(){
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio)return;
 if(!sound){
  sound=new Audio();
  musicGain=sound.createGain();musicGain.gain.value=musicOn?.55:0;
  musicGain.connect(sound.destination);
  nextBar=sound.currentTime+.04;
 }
 if(sound.state!=='running')sound.resume().catch(()=>{});
}
function impactSound(){
 if(!sound||sound.state!=='running')return;
 const at=sound.currentTime;
 const length=Math.floor(sound.sampleRate*.19);
 const buffer=sound.createBuffer(1,length,sound.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++){
  const t=i/sound.sampleRate;
  data[i]=(.7*Math.sin(2*Math.PI*(83*t-114*t*t))+.3*(Math.random()*2-1))*Math.exp(-t*31);
 }
 const source=sound.createBufferSource(), gain=sound.createGain();
 source.buffer=buffer;gain.gain.value=.48;
 source.connect(gain);gain.connect(sound.destination);source.start(at);
}
function tone(note,at,duration,volume,type,pluck=false){
 const voice=sound.createOscillator(), envelope=sound.createGain();
 const filter=sound.createBiquadFilter();
 voice.type=type;voice.frequency.value=440*2**((note-69)/12);
 filter.type='lowpass';filter.frequency.value=pluck?2800:1650;
 envelope.gain.setValueAtTime(.0001,at);
 envelope.gain.exponentialRampToValueAtTime(volume,at+(pluck?.004:.022));
 envelope.gain.exponentialRampToValueAtTime(.0001,at+duration);
 voice.connect(filter);filter.connect(envelope);envelope.connect(musicGain);
 voice.start(at);voice.stop(at+duration+.01);
}
function scheduleMusic(){
 if(!sound||sound.state!=='running'||!musicOn)return;
 if(nextBar<sound.currentTime)nextBar=sound.currentTime+.035;
 if(nextBar>sound.currentTime+.12)return;
 const driving=phase==='drive'||phase==='driveRetry';
 const beat=60/(driving?126:104), root=blues[barIndex], at=nextBar;
 for(const [offset,note] of [0,7,9,10].entries()){
  tone(root+note,at+offset*beat,.35,.19,'triangle');
  tone(offset%2===0?34:38,at+offset*beat,.085,driving?.15:.09,'sine',true);
  if(driving)tone(53,at+(offset+.67)*beat,.05,.045,'triangle',true);
 }
 for(const [offset,note] of hook[barIndex]){
  tone(root+12+note,at+offset*beat,.27,.12,'sawtooth',true);
  tone(root+24+note,at+offset*beat+.009,.11,.043,'triangle',true);
 }
 for(const offset of [1,3]){
  for(const note of [4,7,10])tone(root+12+note,at+offset*beat,.13,.035,'triangle',true);
 }
 if(barIndex===8||barIndex===9)tone(root+36,at+2.1*beat,.72,.047,'sine');
 nextBar+=beat*4;
 barIndex=(barIndex+1)%blues.length;
}

};

const bindings={
 ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',
 KeyA:'ArrowLeft',KeyD:'ArrowRight',KeyW:'ArrowUp',KeyS:'ArrowDown',Space:'Space'
};
document.addEventListener('keydown',e=>{
 if(bindings[e.code]&&e.target.tagName!=='BUTTON'){
  e.preventDefault();keys.add(e.code);
 }
});
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();touches.clear();});
for(const b of document.querySelectorAll('[data-key]')){
 b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touches.set(e.pointerId,b.dataset.key);};
 for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,e=>touches.delete(e.pointerId));
}
