<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade player UI preview</title>
<link rel="stylesheet" href="../../shared/player/shell.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#131118;color:#f8f6fa;font:16px/1.45 system-ui,sans-serif}
main{width:min(100% - 2rem,75rem);margin:clamp(1.5rem,5vw,4.5rem) auto}
header{margin-bottom:1.7rem}h1{font-size:clamp(1.9rem,5vw,3.3rem);letter-spacing:-.05em;margin:0}
header p{color:#bdb7c5;margin:.45rem 0 0}
.preview{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1rem;align-items:start}
.tina{--shell-accent:#ffc1e2;--shell-ink:#331e35;--shell-panel:#2a1c2b;--shell-line:#53394e}
.stick{width:88px;height:88px;border:1px solid #67475c;border-radius:50%;display:grid;place-items:center;background:#221925}
.stick span{width:42px;height:42px;border:1px solid #b9729d;border-radius:50%;background:#754565;box-shadow:0 4px #40293c}
@media(max-width:760px){.preview{grid-template-columns:1fr}.arcade-shell-tools button{padding:.45rem .55rem}}
</style></head><body><main>
<header><h1>Arcade player preview</h1><p>Desktop and mobile layouts using the same shell.</p></header>
<div class="preview">
<section class="arcade-shell" aria-label="Desperados desktop design">
  <div class="arcade-shell-bar"><div><h2 class="arcade-shell-title">Desperados</h2><span class="arcade-shell-secondary">Desktop · Jack and Danny</span></div><div class="arcade-shell-tools"><button type="button" id="pause">Pause</button><button type="button" id="sound">Sound on</button></div></div>
  <div class="arcade-shell-stage"><img src="../../desperados/card-still.webp" alt="Jack jumps from the train toward Danny’s red convertible"></div>
  <div class="arcade-shell-hud"><span>Train escape · <strong>Handoff</strong></span><span>Jack reaches Danny</span></div>
  <div class="arcade-shell-keys"><kbd>← ↑ ↓ →</kbd><span class="arcade-shell-secondary">Move</span><kbd>Space</kbd><span class="arcade-shell-secondary">Shoot</span></div>
</section>
<section class="arcade-shell tina" aria-label="Tina’s World mobile design">
  <div class="arcade-shell-bar"><div><h2 class="arcade-shell-title">Tina’s World</h2><span class="arcade-shell-secondary">Mobile · Garden</span></div><div class="arcade-shell-tools"><button type="button" id="mobile-pause">Pause</button></div></div>
  <div class="arcade-shell-stage"><img src="../../tinas-world/garden.webp" alt="Pink blossom trees around Tina’s garden"></div>
  <div class="arcade-shell-hud"><span>Flowers <strong id="flowers">12 / 20</strong></span><span>Pick a tulip</span></div>
  <div class="arcade-shell-inputs"><div class="arcade-shell-control-label"><div class="stick" aria-hidden="true"><span></span></div>Move</div><div class="arcade-shell-control-label"><button class="arcade-shell-primary" type="button" id="pick" aria-label="A, pick">A</button>Pick</div></div>
</section>
</div></main>
<script>
for(const id of ['pause','mobile-pause','sound']){
 const button=document.getElementById(id);
 button.setAttribute('aria-pressed','false');
 button.addEventListener('click',()=>{
  const active=button.getAttribute('aria-pressed')==='true';
  button.setAttribute('aria-pressed',String(!active));
  button.textContent=id==='sound'?(active?'Sound on':'Muted'):(active?'Pause':'Resume');
 });
}
let count=12;
document.getElementById('pick').addEventListener('click',()=>{
 count=count>=20?12:count+1;
 document.getElementById('flowers').textContent=count+' / 20';
});
</script></body></html>
