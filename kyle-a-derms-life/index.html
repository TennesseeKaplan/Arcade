<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Kyle - A Derm’s Life</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1729; color: #fff0d3; font: 16px system-ui, sans-serif; }
  main { width: min(100%, 68rem); margin: auto; padding: 12px; }
  .beta-banner { display: flex; align-items: center; gap: .65rem; background: #ffce76; color: #26172b; padding: .2rem .65rem; border-radius: 6px; font-size: .8rem; }
  .beta-banner strong { letter-spacing: .1em; }
  header { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(1rem, 3vw, 1.8rem); }
  #clock { text-align: right; min-width: 7ch; font-weight: 900; font-variant-numeric: tabular-nums; }
  #clock.glow { color: #ffe986; text-shadow: 0 0 12px #ffb34e; }
  .game { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(15rem, 1fr); gap: 10px; align-items: start; }
  canvas { width: 100%; height: auto; max-height: calc(100dvh - 86px); object-fit: contain; background: #2e243c; border-radius: 12px; }
  .panel { background: #32273f; padding: 12px; border: 1px solid #66516d; border-radius: 12px; }
  h2, p { margin: 0 0 8px; }
  h2 { font-size: 1.2rem; }
  .stats, #status { color: #dac9df; }
  #status { min-height: 1.4em; }
  [hidden] { display: none !important; }
  #movement { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; width: max-content; margin-top: 7px; touch-action: none; user-select: none; }
  #movement button { padding: 0; background: #594b69; color: #fff0d3; }
  #movement button:active { background: #877498; }
  #movement [data-move="up"] { grid-column: 2; }
  #movement [data-move="left"] { grid-column: 1; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button, input { min-height: 44px; font: inherit; border-radius: 8px; padding: 6px 10px; }
  button { border: 0; background: #ffce76; color: #26172b; font-weight: 800; touch-action: manipulation; cursor: pointer; }
  button[aria-pressed="true"] { background: #a2e3c8; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 100%; border: 2px solid #b391ad; }
  #meter { height: 18px; margin: 0 0 10px; position: relative; background: #1d1729; border-radius: 8px; overflow: hidden; }
  #zone, #needle { position: absolute; top: 0; height: 100%; }
  #zone { background: #73d4ad; }
  #needle { width: 4px; background: white; transform: translateX(-50%); }
  #exchange { color: #ffe986; font-weight: 800; }
  @media (orientation: portrait) { .game { grid-template-columns: 1fr; } }
  @media (max-height: 420px) and (orientation: landscape) {
    main { padding: 6px; }
    .panel { padding: 7px; font-size: .88rem; }
    p, h2 { margin-bottom: 5px; }
  }
  @media (max-height: 280px) {
    main.typing canvas { display: none; }
    main.typing .game { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <p class="beta-banner"><strong>BETA</strong><span>One playable day</span></p>
  <header><h1>Kyle - A Derm’s Life</h1><time id="clock">6:00 AM</time></header>
  <div class="game">
    <canvas id="scene" width="640" height="380" role="img" aria-label="Kyle’s bedroom"></canvas>
    <section class="panel" aria-labelledby="heading">
      <p class="stats" id="stats"></p>
      <h2 id="heading"></h2>
      <p id="status" aria-live="polite"></p>
      <div id="meter" hidden aria-label="Hit the green zone"><span id="zone"></span><span id="needle"></span></div>
      <p id="exchange" hidden aria-live="polite"></p>
      <div id="actions"></div>
      <div id="movement" aria-label="Move Kyle">
        <button type="button" data-move="up" aria-label="Move up">↑</button>
        <button type="button" data-move="left" aria-label="Move left">←</button>
        <button type="button" data-move="down" aria-label="Move down">↓</button>
        <button type="button" data-move="right" aria-label="Move right">→</button>
      </div>
    </section>
  </div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const canvas = byId('scene');
const ctx = canvas.getContext('2d');
const dollars = amount => '$' + amount.toLocaleString('en-US');
const storageKey = 'arcade-kyle-day-prototype-v1';
const yachtPrice = 1100;
const affirmation = 'I AM A DOCTOR I AM A DOCTOR';
const limits = { wake: 5, gym: 36, clinic: 76, mine: 112, exchange: 115, payout: 120 };
const labels = { wake: 'Bachelor pad', gym: 'Gym', clinic: 'Derm clinic', mine: 'MineScape', exchange: 'Cash out', payout: 'End of day', done: 'Day complete', yacht: 'Jacksonville, Florida' };
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let state;
let primary;
let trialUntil = 0;
let trialAt;
let cursor = 0;
let target = .5;
let risk = false;
let recoveryUntil = 0;
let hitUntil = 0;
let effect = '';
let lastExchangeStep = -1;

function fresh() {
  return { phase: 'wake', phaseStart: 0, elapsed: 0, cash: 0, gymPay: 0, reps: 0, failedGym: false,
    exercise: 'Squat', hearts: 3, patients: 0, gold: 0, level: 1, gear: 'Tin blade',
    playerHp: 24, enemyHp: 18, fighting: false, nextAttack: 0 };
}
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    return saved && Object.hasOwn(labels, saved.phase) ? saved : null;
  } catch { return null; }
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
}
function now() { return performance.now() / 1000; }
let origin = now();
let lastFrame = origin;
const keyDirections = new Map([
  ['KeyW', 'up'], ['ArrowUp', 'up'], ['KeyS', 'down'], ['ArrowDown', 'down'],
  ['KeyA', 'left'], ['ArrowLeft', 'left'], ['KeyD', 'right'], ['ArrowRight', 'right']
]);
const keys = new Set();
const pointers = new Map();
const stations = {
  wake: [{ id: 'gym', x: 575, y: 258, name: 'Gym door' }],
  gym: [
    { id: 'squat', x: 130, y: 240, name: 'Squat rack' },
    { id: 'bench', x: 503, y: 240, name: 'Bench' },
    { id: 'clinic', x: 583, y: 310, name: 'Clinic door' }
  ],
  clinic: [
    { id: 'patient', x: 410, y: 240, name: 'Patient' },
    { id: 'home', x: 576, y: 310, name: 'Go home' }
  ],
  mine: [
    { id: 'beetle', x: 347, y: 242, name: 'Slag Beetle' },
    { id: 'exchange', x: 566, y: 309, name: 'Cash out' }
  ],
  payout: [
    { id: 'old-guy', x: 383, y: 240, name: 'Talk' },
    { id: 'bed', x: 98, y: 282, name: 'End day' }
  ]
};
const starts = { wake: 244, gym: 320, clinic: 150, mine: 178, payout: 218 };
let x = 244, y = 244, facing = 1, walking = false, nearby = null, heardPayout = false;

function resetWalk() {
  x = starts[state.phase] ?? 244;
  y = 244;
  facing = 1;
  walking = false;
  nearby = null;
  keys.clear();
  pointers.clear();
}

function walk(dt) {
  const available = stations[state.phase];
  if (!available || trialUntil) return;
  const directions = new Set(pointers.values());
  for (const key of keys) directions.add(keyDirections.get(key));
  const dx = Number(directions.has('right')) - Number(directions.has('left'));
  const dy = Number(directions.has('down')) - Number(directions.has('up'));
  const length = Math.hypot(dx, dy);
  walking = length > 0;
  if (walking) {
    if (dx) facing = dx;
    x = Math.max(52, Math.min(591, x + dx * 218 * dt / length));
    y = Math.max(202, Math.min(320, y + dy * 160 * dt / length));
  }
  let closest = null;
  let radius = 50;
  for (const station of available) {
    const distance = Math.hypot(x - station.x, y - station.y);
    if (distance < radius) {
      radius = distance;
      closest = station.id;
    }
  }
  if (nearby === closest) return;
  if (nearby === 'beetle') state.fighting = false;
  nearby = closest;
  if (nearby === 'squat' || nearby === 'bench') state.exercise = nearby === 'squat' ? 'Squat' : 'Bench';
  renderControls();
}

function button(label, action, { main = false, pressed, disabled = false } = {}) {
  const element = document.createElement('button');
  element.type = 'button';
  element.textContent = label;
  element.disabled = disabled;
  if (pressed !== undefined) element.setAttribute('aria-pressed', pressed);
  element.addEventListener('click', action);
  byId('actions').append(element);
  if (main && !disabled) primary = action;
}
function say(message) { byId('status').textContent = message; }
function refreshStats() {
  const details = {
    gym: state.reps + ' reps',
    clinic: '♥'.repeat(state.hearts) + '♡'.repeat(3 - state.hearts),
    mine: 'Lv. ' + state.level + ' · ' + state.gear + ' · ' + state.gold + ' gold'
  };
  byId('stats').textContent = [dollars(state.cash) + ' yacht fund', details[state.phase]].filter(Boolean).join('  ·  ');
}
function go(phase, message) {
  state.phase = phase;
  state.phaseStart = state.elapsed;
  resetWalk();
  if (phase === 'payout') heardPayout = false;
  trialUntil = 0;
  hitUntil = 0;
  recoveryUntil = 0;
  effect = '';
  if (phase === 'gym') trialAt = state.elapsed + 7 + Math.random() * 5;
  if (phase === 'clinic') { risk = false; target = .5; }
  if (phase === 'exchange') { state.exchangeStart = state.elapsed; lastExchangeStep = -1; }
  if (phase === 'payout') {
    state.gymPay = state.failedGym || state.reps < 6 ? 40 : state.reps >= 15 ? 320 : 150;
    state.cash += state.gymPay;
  }
  renderControls(message);
  save();
}

function renderControls(message) {
  const p = state.phase;
  document.querySelector('main').classList.remove('typing');
  byId('heading').textContent = labels[p];
  canvas.setAttribute('aria-label', labels[p] + ' cartoon scene');
  byId('actions').replaceChildren();
  byId('meter').hidden = nearby !== 'patient';
  byId('movement').hidden = !Object.hasOwn(stations, p);
  byId('exchange').hidden = p !== 'exchange';
  primary = null;
  refreshStats();
  if (p === 'wake') {
    const input = matchMedia('(any-pointer: coarse)').matches ? 'Use the direction pad.' : 'Use WASD or the arrow keys.';
    say('Walk to the gym door. ' + input);
    if (nearby === 'gym') button('Enter gym', () => { origin = now(); go('gym'); }, { main: true });
  }
  if (p === 'gym') {
    say(message || 'Walk up to the squat rack or bench.');
    if (nearby === 'squat' || nearby === 'bench') {
      say(message || state.exercise + ' · Tap Lift or press Space. Every three taps earns a rep.');
      button('Lift', lift, { main: true });
    }
    if (nearby === 'clinic') button('Clock in', () => go('clinic'), { main: true });
  }
  if (p === 'clinic') {
    say(message || 'Walk up to the patient chair.');
    if (nearby === 'patient') {
      say(message || 'Easy or hard (1 or 2). Press Space or Cut in the green zone.');
      button('Easy · $100', () => changeRisk(false), { pressed: !risk });
      button('Hard · $220', () => changeRisk(true), { pressed: risk });
      button('Cut', cut, { main: true });
      updateZone();
    }
    if (nearby === 'home') button('Go home', () => go('mine'), { main: true });
  }
  if (p === 'mine') {
    say(message || 'Walk up to the Slag Beetle to fight.');
    if (nearby === 'beetle') {
      say(message || (state.fighting ? 'Trading blows. Eat a cave pear to heal.' : 'Attack, then stay close to trade blows.'));
      button(state.fighting ? 'Eat' : 'Attack beetle', state.fighting ? eat : startFight, { main: true });
    }
    if (nearby === 'exchange') button('Cash out', () => go('exchange'), { main: true });
  }
  if (p === 'exchange') {
    say('Count out the night’s earnings.');
    byId('exchange').textContent = state.gold + ' MineScape gold';
  }
  if (p === 'payout') {
    say(heardPayout ? 'Walk to End day when you’re ready.' : 'Walk up to the old guy.');
    if (nearby === 'old-guy' && !heardPayout) {
      button('Talk', () => { heardPayout = true; renderControls(); }, { main: true });
    } else if (nearby === 'old-guy') {
      const line = state.gymPay === 320 ? 'Hey, kid. Looking big today.'
        : state.gymPay === 150 ? 'You’re getting there, kid.'
        : 'Looking small today, kid. Best I can do.';
      say('“' + line + '” +' + dollars(state.gymPay));
      if (state.cash >= yachtPrice) button('Buy yacht · ' + dollars(yachtPrice), buyYacht, { main: true });
    }
    if (nearby === 'bed') button('End day', () => go('done'), { main: true });
  }
  if (p === 'done' || p === 'yacht') {
    say(p === 'yacht' ? 'Kyle sails off into the Jacksonville sunset.' :
      dollars(state.cash) + ' saved toward a ' + dollars(yachtPrice) + ' yacht.');
    button('Replay Day 1', restart, { main: true });
    const back = document.createElement('a');
    back.href = '../';
    back.textContent = 'Back to Arcade';
    back.style.color = 'inherit';
    byId('actions').append(back);
  }
}

let taps = 0;
function lift() {
  if (trialUntil) return;
  taps++;
  if (taps % 3 === 0) state.reps++;
  hitUntil = now() + .15;
  refreshStats();
}
function badThoughts() {
  trialUntil = Math.min(state.elapsed + 13, limits.gym);
  trialAt = Infinity;
  document.querySelector('main').classList.add('typing');
  byId('movement').hidden = true;
  keys.clear();
  pointers.clear();
  walking = false;
  byId('actions').replaceChildren();
  primary = null;
  const input = document.createElement('input');
  input.autocomplete = 'off';
  input.autocapitalize = 'characters';
  input.spellcheck = false;
  input.setAttribute('aria-label', 'Type ' + affirmation);
  input.placeholder = affirmation;
  input.addEventListener('input', () => {
    if (input.value.trim().replace(/\s+/g, ' ').toUpperCase() === affirmation) {
      trialUntil = 0;
      renderControls('You shook it off. Back to lifting.');
    }
  });
  byId('actions').append(input);
  input.focus();
}
function changeRisk(value) {
  risk = value;
  renderControls();
  byId('actions').querySelector('[aria-pressed="true"]').focus();
}
function zoneWidth() { return risk ? .15 : .32; }
function updateZone() {
  byId('zone').style.left = ((target - zoneWidth() / 2) * 100) + '%';
  byId('zone').style.width = (zoneWidth() * 100) + '%';
}
function cut() {
  if (now() < hitUntil || !state.hearts || state.patients >= 6) return;
  state.patients++;
  const success = Math.abs(cursor - target) <= zoneWidth() / 2;
  effect = success ? 'POP!' : 'I’m leaving!';
  hitUntil = now() + .65;
  if (success) state.cash += risk ? 220 : 100;
  else state.hearts--;
  say(success ? 'Clean cut. +' + dollars(risk ? 220 : 100)
    : state.hearts ? 'The patient storms out. One heart lost.' : 'Your last patient storms out. Shift over.');
  target = .26 + Math.random() * .48;
  updateZone();
  refreshStats();
}
function startFight() {
  if (state.fighting || state.playerHp <= 0) return;
  state.fighting = true;
  state.nextAttack = state.elapsed + .45;
  renderControls('Trading blows with the Slag Beetle.');
}
function eat() {
  if (state.playerHp <= 0 || now() < recoveryUntil) return;
  state.playerHp = Math.min(24, state.playerHp + 7);
  recoveryUntil = now() + 2;
  say('Kyle eats a cave pear.');
}
function fightTick() {
  if (!state.fighting || nearby !== 'beetle' || state.elapsed < state.nextAttack) return;
  state.nextAttack = state.elapsed + .72;
  state.enemyHp -= state.level > 1 ? 7 : 5;
  hitUntil = now() + .23;
  if (state.enemyHp <= 0) {
    state.gold += 300;
    state.level++;
    state.gear = 'Copper blade';
    state.enemyHp = 18 + state.level * 2;
    state.fighting = false;
    renderControls('Beetle down. +300 gold and a level. Copper blade equipped.');
  } else {
    state.playerHp -= 4;
    if (state.playerHp <= 0) {
      state.fighting = false;
      go('exchange');
    }
  }
}
function exchangeTick() {
  const step = Math.min(2, Math.floor((state.elapsed - state.exchangeStart) / .85));
  if (step === lastExchangeStep) return;
  lastExchangeStep = step;
  byId('exchange').textContent = [
    state.gold + ' MineScape gold',
    state.gold * 2 + ' Venezuelan bolívares',
    dollars(Math.floor(state.gold / 5)) + ' USD'
  ][step];
  if (!motion.matches) byId('exchange').animate(
    [{ opacity: .2, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)' }],
    { duration: 230, easing: 'ease-out' }
  );
}
function finishExchange() {
  state.cash += Math.floor(state.gold / 5);
  state.gold = 0;
  go('payout');
}
function buyYacht() {
  if (state.cash < yachtPrice) return;
  state.cash -= yachtPrice;
  go('yacht');
}
function restart() {
  state = fresh();
  taps = 0;
  origin = now();
  go('wake');
}

function shape(points, fill) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.stroke();
}
function box(x, y, w, h, color, radius = 5) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.stroke();
}
function oval(x, y, w, h, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.stroke();
}
function line(points) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.stroke();
}
function caption(text, x, y, size = 22, color = '#fff1da') {
  ctx.font = '900 ' + size + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function kyle(x, y, scale, outfit, upset = false, flex = false, direction = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * direction, scale);
  const skin = '#f7ae81';
  const coat = outfit === 'home' ? '#528d96' : '#fff5df';
  box(-31, 35, 30, 50, '#48507b');
  box(0, 35, 30, 50, '#48507b');
  box(-30, 78, 24, 18, skin);
  box(6, 78, 24, 18, skin);
  oval(-22, 98, 20, 8, '#28263c');
  oval(22, 98, 20, 8, '#28263c');
  oval(-40, 12, 25, 23, coat);
  oval(40, 12, 25, 23, coat);
  oval(-52, 29, 24, 17, skin);
  oval(55, flex ? -6 : 29, 23, 17, skin);
  oval(-61, 44, 17, 11, skin);
  oval(65, flex ? -25 : 44, 14, 11, skin);
  shape([[-36, -4], [35, -4], [39, 44], [25, 60], [-30, 59], [-40, 39]], coat);
  if (outfit !== 'home') {
    line([[-19, -3], [-8, 21], [-16, 29], [0, 51], [15, 25], [5, 18], [19, -3]]);
    box(19, 18, 12, 8, '#8ad4ba', 2);
  }
  oval(-41, -28, 10, 13, skin);
  oval(41, -28, 10, 13, skin);
  oval(0, -34, 44, 40, skin);
  shape([[-43, -43], [-49, -68], [-30, -61], [-30, -84], [-13, -72], [1, -89],
    [9, -73], [33, -81], [27, -63], [46, -61], [44, -38], [28, -51], [13, -45], [-6, -56], [-23, -43]], '#db5134');
  if (outfit === 'yacht') {
    box(-36, -44, 33, 17, '#242439');
    box(3, -44, 33, 17, '#242439');
    line([[-3, -38], [3, -38]]);
  } else {
    oval(-16, -36, 10, 9, '#fff7eb');
    oval(17, -36, 10, 9, '#fff7eb');
    oval(-13, -35, 2.5, 4, '#262037');
    oval(14, -35, 2.5, 4, '#262037');
    line([[-27, -48], [-9, -51]]);
    line([[10, -51], [28, -46]]);
  }
  if (upset) {
    box(-15, -16, 30, 12, '#fff7eb', 3);
    line([[-14, -10], [14, -10]]);
    oval(-24, -20, 5, 9, '#79dbff');
    oval(25, -17, 5, 12, '#79dbff');
  } else {
    line([[-15, -15], [-5, -9], [12, -10], [20, -17]]);
  }
  ctx.restore();
}
function room(wall, floor) {
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, 640, 380);
  shape([[0, 285], [640, 285], [640, 380], [0, 380]], floor);
}
function desk() {
  box(409, 219, 16, 106, '#905c58');
  box(559, 219, 16, 106, '#905c58');
  box(397, 208, 193, 17, '#d09064');
  box(450, 137, 100, 67, '#302942', 9);
  box(458, 145, 84, 48, '#90e2cf');
  box(472, 201, 44, 8, '#474366');
  caption('MINESCAPE', 500, 174, 12, '#352840');
}
function drawKyleWalking(t, scale, outfit, flex = false, liftOffset = 0) {
  const bounce = walking && !motion.matches ? Math.sin(t * 21) * 4 : 0;
  kyle(x, 240 + (y - 244) * .55 + bounce + liftOffset, scale, outfit, false, flex, facing);
}
function drawStations() {
  for (const station of stations[state.phase] || []) {
    const active = station.id === nearby;
    const labelY = Math.min(350, station.y + 61);
    ctx.font = '900 15px system-ui';
    const width = ctx.measureText(station.name).width + 18;
    box(station.x - width / 2, labelY, width, 24, active ? '#ffce76' : '#332940', 7);
    caption(station.name, station.x, labelY + 17, 15, active ? '#26172b' : '#fff1da');
  }
}
function draw(t) {
  ctx.strokeStyle = '#292032';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const p = state.phase;
  if (p === 'wake' || p === 'exchange' || p === 'done') {
    room('#a77f83', '#5d4859');
    box(40, 60, 122, 92, '#5e5478');
    box(47, 67, 108, 78, '#eeb179');
    line([[101, 67], [101, 145]]);
    box(47, 247, 246, 67, '#d7c6a4', 13);
    oval(187, 275, 35, 15, '#b89c76');
    box(59, 251, 71, 37, '#e3d5c1', 12);
    desk();
    if (p === 'wake') {
      box(547, 140, 65, 137, '#62516e');
      oval(557, 220, 4, 4, '#ffce76');
      drawKyleWalking(t, .75, 'home');
    } else kyle(367, 238, .79, 'home');
  }
  if (p === 'gym') {
    room('#8b626f', '#46384e');
    box(46, 88, 143, 181, '#514859');
    box(62, 97, 112, 163, '#a7b7bb');
    box(86, 170, 15, 125, '#3a354c');
    box(155, 170, 15, 125, '#3a354c');
    box(74, 158, 110, 10, '#c4bccc');
    box(441, 232, 136, 20, '#e29a78');
    box(455, 250, 12, 53, '#3d3447');
    box(552, 250, 12, 53, '#3d3447');
    caption('SQUAT', 123, 67);
    caption('BENCH', 511, 208);
    const bounce = t < hitUntil && !motion.matches ? -9 : 0;
    const shake = trialUntil && !motion.matches ? Math.sin(t * 45) * 3 : 0;
    if (trialUntil) kyle(320 + shake, 231, .85, 'coat', true);
    else drawKyleWalking(t, .76, 'coat', t < hitUntil, bounce);
    if (trialUntil) {
      for (const [x, y, size] of [[135, 74, 61], [216, 53, 74], [333, 78, 91], [461, 64, 82], [525, 92, 51]]) {
        oval(x, y, size, 48, '#272033');
      }
      shape([[306, 96], [342, 96], [326, 115], [352, 115], [307, 149], [319, 124], [301, 124]], '#ffdf7c');
      caption('BAD THOUGHTS', 320, 91, 33, '#ffdf7c');
    }
  }
  if (p === 'clinic') {
    room('#81aaa3', '#53657a');
    box(42, 85, 165, 80, '#d2e5ce');
    box(54, 97, 140, 51, '#eae8d2');
    box(403, 203, 153, 91, '#64769d', 15);
    box(434, 284, 78, 22, '#465177');
    oval(472, 187, 43, 47, '#e2a785');
    oval(458, 154, 31, 15, '#edefe3');
    box(431, 177, 30, 15, '#bac7d1', 6);
    box(465, 177, 30, 15, '#bac7d1', 6);
    if (effect !== 'POP!' || t >= hitUntil) oval(497, 202, 6, 5, '#864f53');
    drawKyleWalking(t, .76, 'coat', t < hitUntil);
    if (t < hitUntil) caption(effect, 467, 116, 31, '#ffe0a2');
  }
  if (p === 'mine') {
    room('#53416f', '#393049');
    shape([[0, 153], [91, 81], [155, 147], [237, 58], [309, 145], [385, 98], [514, 155], [640, 82], [640, 0], [0, 0]], '#362943');
    oval(439, 230, 71, 47, t < hitUntil ? '#dd955f' : '#a36567');
    line([[438, 185], [435, 270]]);
    line([[383, 218], [360, 199], [342, 214]]);
    line([[489, 220], [514, 200], [531, 214]]);
    oval(413, 218, 8, 10, '#ffe280');
    oval(466, 218, 8, 10, '#ffe280');
    drawKyleWalking(t, .72, 'home', state.fighting);
    caption('HP ' + Math.max(0, state.playerHp), x, 101);
    caption('SLAG BEETLE · ' + state.enemyHp + ' HP', 440, 130, 19);
  }
  if (p === 'payout') {
    room('#a17c8b', '#504252');
    drawKyleWalking(t, .76, 'coat');
    if (state.failedGym) oval(x, 278 + (y - 244) * .55, 12, 7, '#2b385d');
    box(419, 198, 74, 115, '#9e756b', 17);
    oval(457, 167, 43, 42, '#dca584');
    oval(425, 150, 13, 17, '#ded5cf');
    oval(488, 150, 13, 17, '#ded5cf');
    line([[447, 189], [458, 181], [473, 187]]);
    box(383, 219, 40, 23, '#8bd3a1', 3);
    caption('USD', 403, 235, 12, '#292032');
  }
  if (p === 'yacht') {
    room('#eb8d85', '#5769a2');
    oval(482, 185, 69, 69, '#ffe59b');
    shape([[104, 240], [526, 240], [473, 321], [155, 321]], '#fff1da');
    line([[127, 273], [504, 273]]);
    kyle(260, 171, .66, 'yacht', false, true);
    box(332, 148, 38, 92, '#dd9a76', 10);
    box(331, 162, 40, 16, '#ea6289');
    box(335, 210, 31, 14, '#ea6289');
    oval(351, 125, 25, 28, '#dd9a76');
    shape([[326, 129], [323, 111], [341, 94], [366, 99], [378, 118], [375, 155], [363, 133], [358, 113]], '#4c3449');
    caption('JACKSONVILLE', 137, 64, 20, '#3d2948');
  }
  if (!trialUntil) drawStations();
}

function updateClock() {
  const phase = state.phase;
  const hours = {
    wake: 6,
    gym: 6 + 3 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.gym - state.phaseStart)),
    clinic: 9 + 8 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.clinic - state.phaseStart)),
    mine: 17 + 5 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.mine - state.phaseStart)),
    exchange: 22, payout: 22.25, done: 22.5, yacht: 22.5
  };
  const minutes = Math.floor(hours[phase] * 60);
  const hour = Math.floor(minutes / 60);
  byId('clock').textContent = (hour % 12 || 12) + ':' + String(minutes % 60).padStart(2, '0') + (hour < 12 ? ' AM' : ' PM');
  byId('clock').classList.toggle('glow', Boolean(trialUntil) ||
    (phase in limits && state.elapsed < limits[phase] && limits[phase] - state.elapsed <= 5));
}
function update(t) {
  walk(Math.max(0, Math.min(.05, t - lastFrame)));
  lastFrame = t;
  if (!['wake', 'done', 'yacht'].includes(state.phase)) {
    state.elapsed = Math.min(120, t - origin);
  }
  if (state.phase === 'gym') {
    if (!trialUntil && state.elapsed >= trialAt && state.elapsed < limits.gym - 3) badThoughts();
    if (trialUntil) {
      say('BAD THOUGHTS · ' + Math.max(0, Math.ceil(trialUntil - state.elapsed)) + 's · ' + affirmation);
      if (state.elapsed >= trialUntil) {
        state.failedGym = true;
        go('clinic', 'The bad thoughts won. Kyle peed his shorts and rushed to work.');
      }
    }
    if (state.phase === 'gym' && state.elapsed >= limits.gym) go('clinic');
  }
  if (state.phase === 'clinic') {
    const sweep = (t * (risk ? 1.08 : .81)) % 2;
    cursor = sweep < 1 ? sweep : 2 - sweep;
    byId('needle').style.left = (cursor * 100) + '%';
    if (state.elapsed >= limits.clinic ||
      ((!state.hearts || state.patients >= 6) && t >= hitUntil)) go('mine');
  }
  if (state.phase === 'mine') {
    if (state.elapsed >= limits.mine) go('exchange');
    else fightTick();
  }
  if (state.phase === 'exchange') {
    exchangeTick();
    if (state.elapsed >= limits.exchange || state.elapsed - state.exchangeStart >= 2.7) finishExchange();
  }
  updateClock();
  draw(t);
  requestAnimationFrame(ms => update(ms / 1000));
}

document.addEventListener('keydown', event => {
  if (event.target instanceof HTMLInputElement || event.ctrlKey || event.altKey || event.metaKey) return;
  if (keyDirections.has(event.code) && Object.hasOwn(stations, state.phase) && !trialUntil) {
    event.preventDefault();
    keys.add(event.code);
  }
  if (nearby === 'patient' && !event.repeat && ['Digit1', 'Digit2'].includes(event.code)) {
    event.preventDefault();
    changeRisk(event.code === 'Digit2');
  }
  if (event.code === 'Space' && primary && !event.repeat) {
    event.preventDefault();
    primary();
  }
});
document.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', () => { keys.clear(); pointers.clear(); });
for (const padButton of byId('movement').querySelectorAll('[data-move]')) {
  padButton.addEventListener('pointerdown', event => {
    event.preventDefault();
    padButton.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, padButton.dataset.move);
  });
  for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    padButton.addEventListener(eventName, event => pointers.delete(event.pointerId));
  }
}
state = load() || fresh();
state.fighting = false;
resetWalk();
origin = now() - state.elapsed;
trialAt = state.elapsed + 7 + Math.random() * 5;
renderControls();
requestAnimationFrame(ms => update(ms / 1000));
</script>
</body>
