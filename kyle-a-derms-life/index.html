<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Kyle - A Derm’s Life</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1729; color: #fff0d3; font: 16px system-ui, sans-serif; }
  main { width: min(100%, 68rem); margin: auto; padding: 12px; }
  .beta-banner { display: flex; align-items: center; gap: .65rem; background: #ffce76; color: #26172b; padding: .2rem .65rem; border-radius: 6px; font-size: .8rem; }
  .beta-banner strong { letter-spacing: .1em; }
  header { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(1rem, 3vw, 1.8rem); }
  #clock { text-align: right; min-width: 7ch; font-weight: 900; font-variant-numeric: tabular-nums; }
  #clock.glow { color: #ffe986; text-shadow: 0 0 12px #ffb34e; }
  .game { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(15rem, 1fr); gap: 10px; align-items: start; }
  canvas { width: 100%; height: auto; max-height: calc(100dvh - 86px); object-fit: contain; background: #2e243c; border-radius: 12px; }
  .panel { background: #32273f; padding: 12px; border: 1px solid #66516d; border-radius: 12px; }
  h2, p { margin: 0 0 8px; }
  h2 { font-size: 1.2rem; }
  .stats, #status { color: #dac9df; }
  #status { min-height: 1.4em; }
  [hidden] { display: none !important; }
  #movement { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; width: max-content; margin-top: 7px; touch-action: none; user-select: none; }
  #movement button { padding: 0; background: #594b69; color: #fff0d3; }
  #movement button:active { background: #877498; }
  #movement [data-move="up"] { grid-column: 2; }
  #movement [data-move="left"] { grid-column: 1; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button, input { min-height: 44px; font: inherit; border-radius: 8px; padding: 6px 10px; }
  button { border: 0; background: #ffce76; color: #26172b; font-weight: 800; touch-action: manipulation; cursor: pointer; }
  button[aria-pressed="true"] { background: #a2e3c8; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 100%; border: 2px solid #b391ad; }
  #meter { height: 18px; margin: 0 0 10px; position: relative; background: #1d1729; border-radius: 8px; overflow: hidden; }
  #zone, #needle { position: absolute; top: 0; height: 100%; }
  #zone { background: #73d4ad; }
  #needle { width: 4px; background: white; transform: translateX(-50%); }
  #exchange { color: #ffe986; font-weight: 800; }
  @media (orientation: portrait) { .game { grid-template-columns: 1fr; } }
  @media (max-height: 420px) and (orientation: landscape) {
    main { padding: 6px; }
    .panel { padding: 7px; font-size: .88rem; }
    p, h2 { margin-bottom: 5px; }
  }
  @media (max-height: 280px) {
    main.typing canvas { display: none; }
    main.typing .game { grid-template-columns: 1fr; }
  }
  main.in-mine .game { position: relative; display: block; }
  main.in-mine .panel { position: absolute; inset: auto 0 0; background: #302641ed; padding: 6px 10px; }
  main.in-mine canvas { display: block; margin: auto; max-height: calc(100dvh - 85px); }
  main.in-mine #heading { display: none; }
  main.in-mine #movement { position: absolute; right: 8px; bottom: 8px; }
  main.in-mine #stick { display: none; }
  @media (any-pointer: coarse) { main.in-mine #actions { padding-right: 103px; } }
  .top-hud { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  #cash { white-space: nowrap; font-weight: 800; color: #adf0ad; }
  #sound { min-height: 30px; font-size: .72rem; }
  #clock { display: inline-block; transition: transform .2s; transform-origin: right; }
  #clock.glow { transform: scale(1.28); }
  .scene-frame { position: relative; min-width: 0; }
  #title-scroll { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: .6rem; text-align: center; padding: 1rem; background: #211a32ed; border-radius: 12px; }
  #title-scroll p { max-width: 32ch; }
  #title-scroll h2 { color: #ffce76; font-size: clamp(1.1rem, 3vw, 2rem); }
  #movement { display: flex; align-items: center; gap: 9px; width: auto; }
  #stick { width: 74px; height: 74px; display: grid; place-items: center; border-radius: 50%; background: #483b5b; touch-action: none; user-select: none; }
  #knob { width: 34px; height: 34px; border-radius: 50%; background: #8e7da0; pointer-events: none; }
  #movement .ab { width: 44px; border-radius: 50%; background: #ffce76; color: #26172b; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  @media (orientation: landscape) and (max-height: 390px) {
    #stick { width: 59px; height: 59px; }
    #knob { width: 29px; height: 29px; }
    .beta-banner { margin-bottom: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { #clock { transition: none; } }
  body { background: #151a1b; color: #fbecd2; }
  main { max-width: 960px; }
  .beta-banner { background: #30342b; color: #e8d7aa; border: 1px solid #645d46; border-radius: 2px; }
  .game { grid-template-columns: 1fr; gap: 3px; }
  .scene-frame { position: relative; background: #10161b; border: 2px solid #887953; box-shadow: 0 0 0 3px #252b24; }
  canvas, main.in-mine canvas { display: block; margin: auto; border-radius: 0; max-height: calc(100dvh - 208px); image-rendering: pixelated; }
  .panel, main.in-mine .panel { position: relative; inset: auto; background: #202b2a; border: 1px solid #78816a; border-radius: 0; padding: 7px 11px; min-height: 100px; }
  #heading { color: #f0cf90; font: 800 1.05rem Georgia, serif; }
  #status, .stats { color: #e0dcc2; }
  #status { min-height: 0; }
  button, .panel button { color: #f7ead1; background: #394540; border: 1px solid #778275; border-radius: 2px; }
  button[aria-pressed="true"], #actions button:last-child:not([aria-pressed]), #continue { background: #d5b575; color: #28251d; }
  #meter { background: #151d20; border: 1px solid #927e59; border-radius: 2px; }
  #needle { background: #fff3bf; box-shadow: 0 0 4px #ea9a47; }
  #zone { background: #739a5d; }
  #dialogue { position: absolute; left: 5%; right: 5%; bottom: 5%; z-index: 2; background: #172326f5; border: 2px solid #bda373; padding: 8px 12px; box-shadow: 0 4px #121b1e; }
  #dialogue strong { color: #e6c789; }
  #dialogue p { margin: 4px 0; }
  #dialogue button { min-height: 40px; }
  main.in-mine #stick { display: grid; }
  main.in-mine #movement { position: static; }
  @media (any-pointer: coarse) and (orientation: landscape) {
    .game, main.in-mine .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(13rem, 32%); gap: 5px; }
    canvas, main.in-mine canvas { max-height: calc(100dvh - 79px); }
    .panel, main.in-mine .panel { font-size: .85rem; padding: 6px; }
    main.in-mine #actions { padding-right: 0; }
    #movement, main.in-mine #movement { position: static; }
  }
  @media (orientation: portrait) { canvas, main.in-mine canvas { max-height: none; } }
</style>
</head>
<body>
<main>
  <p class="beta-banner"><strong>BETA</strong><span>One playable day</span></p>
  <header><h1>Kyle - A Derm’s Life</h1><div class="top-hud"><button id="sound" type="button" aria-pressed="false">Mute</button><span id="cash" aria-label="Yacht fund">$0</span><time id="clock">6:00 AM</time></div></header>
  <div class="game">
    <div class="scene-frame">
      <canvas id="scene" width="640" height="380" role="img" aria-label="Kyle’s bedroom"></canvas>
      <section id="dialogue" hidden aria-live="polite"><strong id="speaker"></strong><p id="speech"></p><button id="continue" type="button">Continue · A / Space</button></section>
      <div id="title-scroll">
        <h2>Kyle - A Derm’s Life</h2>
        <p>Five days to make $1,100 and buy a yacht. Fall short and it’s back to the bedroom as a full-time streamer.</p>
        <button id="start" type="button">Start Day 1</button>
      </div>
    </div>
    <section class="panel" aria-labelledby="heading">
      <p class="stats" id="stats"></p>
      <h2 id="heading"></h2>
      <p id="status" aria-live="polite"></p>
      <div id="meter" hidden aria-label="Hit the green zone"><span id="zone"></span><span id="needle"></span></div>
      <p id="exchange" hidden aria-live="polite"></p>
      <div id="actions"></div>
      <div id="movement" aria-label="Game controls">
        <div id="stick" aria-label="Movement joystick"><span id="knob"></span></div>
        <button class="ab" id="game-a" type="button" aria-label="A, interact">A</button>
        <button class="ab" id="game-b" type="button" aria-label="B, back or use item">B</button>
      </div>
    </section>
  </div>
</main>

function tone(hz, duration, wave = 'sine', volume = .06, offset = 0) {
  if (!audio || muted || audio.state !== 'running') return;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const start = audio.currentTime + offset;
  oscillator.type = wave;
  oscillator.frequency.value = hz;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(.001, start + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start + duration);
}
function saySound(words, rate = 1) {
  if (muted || !audio || !('speechSynthesis' in window)) return;
  const voice = new SpeechSynthesisUtterance(words);
  voice.rate = rate;
  voice.volume = .35;
  speechSynthesis.speak(voice);
}

  }
}
function soundtrack(t) {
  const music = {
    gym: [[82, 82, 98, 74, 82, 110, 98, 74], 'sawtooth', .24, .022],
    clinic: [[262, 330, 392, 440, 349, 330, 294, 392], 'triangle', .33, .033],
    mine: [[392, 440, 523, 587, 523, 440, 349, 392], 'sine', .46, .045]
  }[state.phase];
  if (!music) return;
  const [notes, wave, spacing, volume] = music;
  const beat = Math.floor((t - sceneAt) / spacing);
  if (beat === musicBeat) return;
  musicBeat = beat;
  tone(notes[Math.max(0, beat) % notes.length], spacing * .88, wave, volume);
}

function walk(dt) {
  const available = stations[state.phase];
  if (!available || monitorUntil || dialogue || trialUntil || titleOpen || lifting || clinicActive || loot) return;
  const directions = new Set(pointers.values());
  for (const key of keys) directions.add(keyDirections.get(key));
  const dx = Number(directions.has('right')) - Number(directions.has('left'));
  const dy = Number(directions.has('down')) - Number(directions.has('up'));
  const length = Math.hypot(dx, dy);
  walking = length > 0;
  if (walking) {
    if (dx) facing = dx;
    aim = { x: dx / length, y: dy / length };
    x = Math.max(52, Math.min(591, x + dx * 218 * dt / length));
    y = Math.max(202, Math.min(320, y + dy * 160 * dt / length));
  }
  if (state.phase === 'mine') return;
  let closest = null;
  let radius = 50;
  for (const station of available) {
    const distance = Math.hypot(x - station.x, y - station.y);
    if (distance < radius) {
      radius = distance;
      closest = station.id;
    }
  }
  if (nearby === closest) return;
  if (nearby === 'beetle') state.fighting = false;
  nearby = closest;
  if (nearby === 'squat' || nearby === 'bench') state.exercise = nearby === 'squat' ? 'Squat' : 'Bench';
  renderControls();
}

    } else if (p === 'desk') drawKyleWalking(t, .75, 'home');
    else {

    else if (lifting) {
      drawRep(t);
    } else drawKyleWalking(t, .76, 'coat', t < hitUntil, bounce);
    if (trialUntil) {

      shape([[306, 96], [342, 96], [326, 115], [352, 115], [307, 149], [319, 124], [301, 124]], '#ffdf7c');

  if (p === 'clinic') {

    box(403, 203, 153, 91, '#64769d', 15);

    const reaction = clinicActive && t < hitUntil;

    npc(old ? 0 : 1, px + arrival, 315 + Math.abs(Math.sin(arrival / 5)) * 4, angry ? 190 : 160, angry);
    if (clinicActive) kyle(301, 240, .76, 'coat');
    else drawKyleWalking(t, .76, 'coat');
    if (smiling) {
      box(130, 52, 380, 271, '#a3baaa', 14);

      ctx.beginPath();

    } else if (angry) {
      oval(px - 64, 162, 16, 9, '#f1ebe1');
      oval(px + 60, 154, 20, 11, '#f1ebe1');
    } else if (clinicActive) {
      box(345, 91, 244, 35, '#fff2de', 8);
      caption('I’m a different guy btw', 467, 114, 15, '#26172b');
    }
  }
  if (p === 'mine') {
    room('#53416f', '#393049');
    shape([[0, 153], [91, 81], [155, 147], [237, 58], [309, 145], [385, 98], [514, 155], [640, 82], [640, 0], [0, 0]], '#362943');
    for (const [gx, gy, height] of [[57, 302, 71], [585, 266, 44], [599, 286, 78], [140, 204, 32]]) {
      flat([[gx - 18, gy], [gx - 7, gy - height * .75], [gx + 4, gy - height], [gx + 16, gy - height * .36], [gx + 12, gy]], '#63a5a3');
      flat([[gx + 4, gy - height], [gx + 16, gy - height * .36], [gx + 12, gy], [gx + 2, gy]], '#355c69');
    }
    const depth = value => 227 + (value - 242) * .72;
    const ex = enemy.x;
    const ey = depth(enemy.y) + 27;
    if (enemy.windup) {
      ctx.save();
      ctx.globalAlpha = .52;
      oval(ex, ey + 16, 60, 22, '#d4794f');
      ctx.restore();
    }
    const shell = enemy.flash > state.elapsed ? '#edbe85' : '#82574e';
    const legs = Math.sin(t * 22) * 5;
    for (const side of [-1, 1]) {
      for (const offset of [-21, 0, 21]) {
        flat([[ex + side * 18, ey + offset * .35], [ex + side * 45, ey + offset * .5 + legs], [ex + side * 56, ey + offset * .7 + 9], [ex + side * 43, ey + offset * .5 + 6]], '#433b45');
      }
    }
    flat([[ex - 44, ey], [ex - 29, ey - 28], [ex + 24, ey - 33], [ex + 44, ey - 10], [ex + 34, ey + 19], [ex - 27, ey + 22]], shell);
    flat([[ex - 29, ey - 28], [ex + 24, ey - 33], [ex + 2, ey - 6], [ex - 44, ey]], '#ad8060');
    flat([[ex + 2, ey - 6], [ex + 44, ey - 10], [ex + 34, ey + 19], [ex - 27, ey + 22]], '#614251');
    oval(ex - 16, ey + 2, 4, 5, '#f6cb72');
    oval(ex + 14, ey + 2, 4, 5, '#f6cb72');
    drawKyleWalking(t, .64, 'home');
    if (swing) {
      const phase = Math.max(0, Math.min(1, (state.elapsed - swing.at) / .38));
      const facingAngle = Math.atan2(swing.y * .7, swing.x);
      const angle = facingAngle - 1.22 + phase * 2.44;
      const playerY = 247 + (y - 244) * .55;
      ctx.save();
      ctx.translate(x, playerY);
      ctx.rotate(angle);
      flat([[15, -6], [57, -5], [74, 0], [57, 5], [15, 6]], '#f3dfaa');
      flat([[15, -10], [21, -10], [21, 10], [15, 10]], '#ac835b');
      ctx.restore();
    }
    if (state.gear !== 'Tin blade') {
      box(x + 27, 239, 25, 23, state.gear === 'Holy Water' ? '#72e2f4' : '#b9a361', 3);
      caption(state.gear, x, 332, 16);
    }
    caption('KYLE  ' + Math.max(0, state.playerHp) + ' HP', 103, 34, 16);
    caption('SLAG BEETLE  ' + Math.max(0, state.enemyHp) + ' HP', 503, 34, 16);
    for (const [left, fraction, color] of [[44, state.playerHp / 24, '#76b388'], [438, state.enemyHp / (state.level === 1 ? 18 : 18 + state.level * 2), '#c08158']]) {
      ctx.fillStyle = '#18242a';
      ctx.fillRect(left, 40, 120, 5);
      ctx.fillStyle = color;
      ctx.fillRect(left, 40, 120 * Math.max(0, Math.min(1, fraction)), 5);
    }
    if (enemy.windup) caption('!', ex, ey - 43, 27, '#ffcc80');
  }
  if (p === 'gymPay') {
    room('#a17c8b', '#504252');
    drawKyleWalking(t, .76, 'coat');
    if (state.failedGym) oval(x, 278 + (y - 244) * .55, 12, 7, '#2b385d');
    const arrival = Math.max(0, 1 - (t - sceneAt) * 1.8) * 140;
    ctx.save();
    ctx.translate(arrival, 0);
    npc(2, 458, 318 + Math.abs(Math.sin(arrival / 5)) * 5, 180);
    box(383, 219, 40, 23, '#8bd3a1', 3);
    caption('USD', 403, 235, 12, '#292032');
    ctx.restore();
  }
  if (p === 'dream' && state.cash < yachtPrice / 5) {
    room('#e8af78', '#805d5a');
    kyle(260, 220, .8, 'home');
    box(337, 214, 173, 109, '#a7a49d');
    box(349, 216, 66, 40, '#d49a42');
    caption('FRY COOK', 422, 123, 28, '#392337');
  }
  if (p === 'yacht' || (p === 'dream' && state.cash >= yachtPrice / 5)) {
    room('#eb8d85', '#5769a2');
    oval(482, 185, 69, 69, '#ffe59b');
    shape([[104, 240], [526, 240], [473, 321], [155, 321]], '#fff1da');
    line([[127, 273], [504, 273]]);
    kyle(260, 171, .66, 'yacht', false, true);
    box(332, 148, 38, 92, '#dd9a76', 10);
    box(331, 162, 40, 16, '#ea6289');
    box(335, 210, 31, 14, '#ea6289');
    oval(351, 125, 25, 28, '#dd9a76');
    shape([[326, 129], [323, 111], [341, 94], [366, 99], [378, 118], [375, 155], [363, 133], [358, 113]], '#4c3449');
    caption('JACKSONVILLE', 137, 64, 20, '#3d2948');
  }
  if (!trialUntil && !lifting && !clinicActive && p !== 'mine') drawStations();
  ctx.restore();
  if (p === 'mine' && !motion.matches && t - sceneAt < .35) {
    ctx.fillStyle = 'rgba(160, 225, 196, ' + (1 - (t - sceneAt) / .35) * .5 + ')';
    ctx.fillRect(0, 0, 640, 380);
  }
}

function updateClock() {
  const phase = state.phase;
  const hours = {
    wake: 6, gymPay: 8.95, desk: 17, dream: 22.5,
    gym: 6 + 3 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.gym - state.phaseStart)),
    clinic: 9 + 8 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.clinic - state.phaseStart)),
    mine: 17 + 5 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.mine - state.phaseStart)),
    exchange: 22, payout: 22.25, done: 22.5, yacht: 22.5
  };
  const minutes = Math.floor(hours[phase] * 60);
  const hour = Math.floor(minutes / 60);
  byId('clock').textContent = (hour % 12 || 12) + ':' + String(minutes % 60).padStart(2, '0') + (hour < 12 ? ' AM' : ' PM');
  const remaining = limits[phase] - state.elapsed;
  byId('clock').classList.toggle('glow', Boolean(trialUntil) || (remaining > 0 && remaining <= 4));
  const tick = phase + Math.ceil(remaining);
  if (remaining > 0 && remaining <= 4 && tick !== tickStamp) {
    tickStamp = tick;
    tone(330, .065, 'square', .14);
  }
}
function update(t) {
  if (titleOpen) { draw(t); requestAnimationFrame(ms => update(ms / 1000)); return; }
  const dt = Math.max(0, Math.min(.05, t - lastFrame));
  lastFrame = t;
  if (dialogue) {
    byId('clock').classList.remove('glow');
    draw(t);
    requestAnimationFrame(ms => update(ms / 1000));
    return;
  }
  walk(dt);
  if (!['wake', 'done', 'yacht'].includes(state.phase)) {
    state.elapsed = Math.min(120, t - origin);
  }
  if (state.phase === 'gym') {
    if (!trialUntil && state.elapsed >= trialAt && state.elapsed < limits.gym - 3) badThoughts();
    if (trialUntil) {
      say('BAD THOUGHTS · ' + Math.max(0, Math.ceil(trialUntil - state.elapsed)) + 's · ' + affirmation);
      if (state.elapsed >= trialUntil) {
        state.failedGym = true;
        feedback(false);
        go('gymPay', 'The bad thoughts won. Kyle peed his shorts.');
      }
    }
    if (state.phase === 'gym' && state.elapsed >= limits.gym) go('gymPay');
  }
  if (state.phase === 'gymPay' && state.elapsed >= limits.gymPay) go('clinic');
  if (state.phase === 'clinic') {
    const sweep = (t * (risk ? 1.08 : .81)) % 2;
    cursor = sweep < 1 ? sweep : 2 - sweep;
    byId('needle').style.left = (cursor * 100) + '%';
    if (state.elapsed >= limits.clinic ||
      ((!state.hearts || state.patients >= 6) && t >= hitUntil)) go('desk');
  }
  if (state.phase === 'desk' && !monitorUntil && state.elapsed >= 90.4) enterMonitor();
  if (state.phase === 'desk' && monitorUntil && t >= monitorUntil) go('mine');
  if (state.phase === 'mine') {
    if (state.elapsed >= limits.mine) go('exchange');
    else fightTick(dt);
  }
  if (state.phase === 'exchange') {
    exchangeTick();
    if (state.elapsed >= limits.exchange || state.elapsed - state.exchangeStart >= 2.7) finishExchange();
  }
  if (state.phase === 'dream' && t >= dreamUntil) go('done');
  soundtrack(t);
  updateClock();
  draw(t);
  requestAnimationFrame(ms => update(ms / 1000));
}

document.addEventListener('keydown', event => {
  if (dialogue) {
    if (event.code === 'Space' && !event.repeat) { event.preventDefault(); advance(); }
    return;
  }
  if (titleOpen || event.target instanceof HTMLInputElement || event.ctrlKey || event.altKey || event.metaKey) return;
  if (keyDirections.has(event.code) && Object.hasOwn(stations, state.phase) && !trialUntil) {
    event.preventDefault();
    keys.add(event.code);
  }
  if (clinicActive && !event.repeat && ['Digit1', 'Digit2'].includes(event.code)) {
    event.preventDefault();
    changeRisk(event.code === 'Digit2');
  }
  if (event.code === 'KeyX' && secondary && !event.repeat) secondary();
  if (event.code === 'Space' && primary && !event.repeat) {
    event.preventDefault();
    pointerCursor = NaN;
    primary();
  }
});
document.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', () => { keys.clear(); pointers.clear(); });
const stick = byId('stick');
function moveStick(event) {
  const rect = stick.getBoundingClientRect();
  const dx = event.clientX - rect.left - rect.width / 2;
  const dy = event.clientY - rect.top - rect.height / 2;
  const distance = Math.hypot(dx, dy);
  const scale = Math.min(1, 21 / Math.max(1, distance));
  byId('knob').style.transform = 'translate(' + dx * scale + 'px,' + dy * scale + 'px)';
  pointers.clear();
  if (distance < 8) return;
  if (Math.abs(dx) > distance * .35) pointers.set('horizontal', dx < 0 ? 'left' : 'right');
  if (Math.abs(dy) > distance * .35) pointers.set('vertical', dy < 0 ? 'up' : 'down');
}
stick.addEventListener('pointerdown', event => {
  event.preventDefault();
  stick.setPointerCapture(event.pointerId);
  moveStick(event);
});
stick.addEventListener('pointermove', event => {
  if (stick.hasPointerCapture(event.pointerId)) moveStick(event);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  stick.addEventListener(eventName, () => { pointers.clear(); byId('knob').style.transform = ''; });
}
byId('continue').addEventListener('click', advance);
byId('game-a').addEventListener('pointerdown', () => { if (primary === cut) pointerCursor = cursor; });
byId('game-a').addEventListener('pointercancel', () => { pointerCursor = NaN; });
byId('game-a').addEventListener('click', () => dialogue ? advance() : primary?.());
byId('game-b').addEventListener('click', () => { if (!dialogue) secondary?.(); });
byId('sound').addEventListener('click', event => {
  muted = !muted;
  event.currentTarget.setAttribute('aria-pressed', muted);
  event.currentTarget.textContent = muted ? 'Unmute' : 'Mute';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
byId('start').addEventListener('click', () => {
  titleOpen = false;
  byId('title-scroll').hidden = true;
  if (window.AudioContext) audio = new AudioContext();
  audio?.resume().catch(() => {});
  origin = now() - state.elapsed;
  if (state.phase === 'wake') {
    saySound('Time for gym.');
    talk('Kyle', 'Time for gym.');
  }
  if (state.phase === 'gymPay') talk('Gym regular', byId('status').textContent, () => go('clinic'));
  if (state.phase === 'exchange') talk('Kyle', 'I need to convert this to dollars. Good thing there’s a way.', () => { sceneAt = now(); });
  renderControls();
});
state = load() || fresh();
state.fighting = false;
resetWalk();
if (state.phase === 'mine') resetArena();
if (state.phase === 'dream') dreamUntil = now() + 1;
sceneAt = now();
origin = now() - state.elapsed;
trialAt = state.elapsed + 7 + Math.random() * 5;
renderControls();
requestAnimationFrame(ms => update(ms / 1000));
</script>
