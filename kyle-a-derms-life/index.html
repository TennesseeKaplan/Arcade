<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Kyle - A Derm’s Life</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1729; color: #fff0d3; font: 16px system-ui, sans-serif; }
  main { width: min(100%, 68rem); margin: auto; padding: 12px; }
  .beta-banner { display: flex; align-items: center; gap: .65rem; background: #ffce76; color: #26172b; padding: .2rem .65rem; border-radius: 6px; font-size: .8rem; }
  .beta-banner strong { letter-spacing: .1em; }
  header { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(1rem, 3vw, 1.8rem); }
  #clock { text-align: right; min-width: 7ch; font-weight: 900; font-variant-numeric: tabular-nums; }
  #clock.glow { color: #ffe986; text-shadow: 0 0 12px #ffb34e; }
  .game { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(15rem, 1fr); gap: 10px; align-items: start; }
  canvas { width: 100%; height: auto; max-height: calc(100dvh - 86px); object-fit: contain; background: #2e243c; border-radius: 12px; }
  .panel { background: #32273f; padding: 12px; border: 1px solid #66516d; border-radius: 12px; }
  h2, p { margin: 0 0 8px; }
  h2 { font-size: 1.2rem; }
  .stats, #status { color: #dac9df; }
  #status { min-height: 1.4em; }
  [hidden] { display: none !important; }
  #movement { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; width: max-content; margin-top: 7px; touch-action: none; user-select: none; }
  #movement button { padding: 0; background: #594b69; color: #fff0d3; }
  #movement button:active { background: #877498; }
  #movement [data-move="up"] { grid-column: 2; }
  #movement [data-move="left"] { grid-column: 1; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button, input { min-height: 44px; font: inherit; border-radius: 8px; padding: 6px 10px; }
  button { border: 0; background: #ffce76; color: #26172b; font-weight: 800; touch-action: manipulation; cursor: pointer; }
  button[aria-pressed="true"] { background: #a2e3c8; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 100%; border: 2px solid #b391ad; }
  #meter { height: 18px; margin: 0 0 10px; position: relative; background: #1d1729; border-radius: 8px; overflow: hidden; }
  #zone, #needle { position: absolute; top: 0; height: 100%; }
  #zone { background: #73d4ad; }
  #needle { width: 4px; background: white; transform: translateX(-50%); }
  #exchange { color: #ffe986; font-weight: 800; }
  @media (orientation: portrait) { .game { grid-template-columns: 1fr; } }
  @media (max-height: 420px) and (orientation: landscape) {
    main { padding: 6px; }
    .panel { padding: 7px; font-size: .88rem; }
    p, h2 { margin-bottom: 5px; }
  }
  @media (max-height: 280px) {
    main.typing canvas { display: none; }
    main.typing .game { grid-template-columns: 1fr; }
  }
  main.in-mine .game { position: relative; display: block; }
  main.in-mine .panel { position: absolute; inset: auto 0 0; background: #302641ed; padding: 6px 10px; }
  main.in-mine canvas { display: block; margin: auto; max-height: calc(100dvh - 85px); }
  main.in-mine #heading { display: none; }
  main.in-mine #movement { position: absolute; right: 8px; bottom: 8px; }
  main.in-mine #stick { display: none; }
  @media (any-pointer: coarse) { main.in-mine #actions { padding-right: 103px; } }
  .top-hud { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  #cash { white-space: nowrap; font-weight: 800; color: #adf0ad; }
  #sound { min-height: 30px; font-size: .72rem; }
  #clock { display: inline-block; transition: transform .2s; transform-origin: right; }
  #clock.glow { transform: scale(1.28); }
  .scene-frame { position: relative; min-width: 0; }
  #title-scroll { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: .6rem; text-align: center; padding: 1rem; background: #211a32ed; border-radius: 12px; }
  #title-scroll p { max-width: 32ch; }
  #title-scroll h2 { color: #ffce76; font-size: clamp(1.1rem, 3vw, 2rem); }
  #movement { display: flex; align-items: center; gap: 9px; width: auto; }
  #stick { width: 74px; height: 74px; display: grid; place-items: center; border-radius: 50%; background: #483b5b; touch-action: none; user-select: none; }
  #knob { width: 34px; height: 34px; border-radius: 50%; background: #8e7da0; pointer-events: none; }
  #movement .ab { width: 44px; border-radius: 50%; background: #ffce76; color: #26172b; }

    #stick { width: 59px; height: 59px; }
    #knob { width: 29px; height: 29px; }

  }

</style>

function tone(hz, duration, wave = 'sine', volume = .06, offset = 0) {
  if (!audio || muted || audio.state !== 'running') return;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const start = audio.currentTime + offset;
  oscillator.type = wave;
  oscillator.frequency.value = hz;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(.001, start + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start + duration);
}

  speechSynthesis.speak(voice);
}

  tone(notes[Math.max(0, beat) % notes.length], spacing * .88, wave, volume);

function walk(dt) {
  const available = stations[state.phase];

  const directions = new Set(pointers.values());

  walking = length > 0;
  if (walking) {
    if (dx) facing = dx;
    x = Math.max(52, Math.min(591, x + dx * 218 * dt / length));
    y = Math.max(202, Math.min(320, y + dy * 160 * dt / length));
  }
  let closest = null;
  let radius = 50;
  for (const station of available) {
    const distance = Math.hypot(x - station.x, y - station.y);
    if (distance < radius) {
      radius = distance;
      closest = station.id;
    }
  }
  if (nearby === closest) return;

    if (state.failedGym) oval(x, 278 + (y - 244) * .55, 12, 7, '#2b385d');
    const arrival = Math.max(0, 1 - (t - sceneAt) * 1.8) * 140;
    ctx.save();
    ctx.translate(arrival, 0);
    box(419, 198, 74, 115, '#9e756b', 17);
    oval(457, 167, 43, 42, '#dca584');
    oval(425, 150, 13, 17, '#ded5cf');
    oval(488, 150, 13, 17, '#ded5cf');
    line([[447, 189], [458, 181], [473, 187]]);
    box(383, 219, 40, 23, '#8bd3a1', 3);
    caption('USD', 403, 235, 12, '#292032');
    ctx.restore();
  }
  if (p === 'dream' && state.cash < yachtPrice / 5) {
    room('#e8af78', '#805d5a');
    kyle(260, 220, .8, 'home');
    box(337, 214, 173, 109, '#a7a49d');
    box(349, 216, 66, 40, '#d49a42');
    caption('FRY COOK', 422, 123, 28, '#392337');
  }
  if (p === 'yacht' || (p === 'dream' && state.cash >= yachtPrice / 5)) {
    room('#eb8d85', '#5769a2');
    oval(482, 185, 69, 69, '#ffe59b');
    shape([[104, 240], [526, 240], [473, 321], [155, 321]], '#fff1da');
    line([[127, 273], [504, 273]]);
    kyle(260, 171, .66, 'yacht', false, true);
    box(332, 148, 38, 92, '#dd9a76', 10);
    box(331, 162, 40, 16, '#ea6289');
    box(335, 210, 31, 14, '#ea6289');
    oval(351, 125, 25, 28, '#dd9a76');
    shape([[326, 129], [323, 111], [341, 94], [366, 99], [378, 118], [375, 155], [363, 133], [358, 113]], '#4c3449');
    caption('JACKSONVILLE', 137, 64, 20, '#3d2948');
  }
  if (!trialUntil && !lifting && !clinicActive && p !== 'mine') drawStations();
  ctx.restore();
  if (p === 'mine' && !motion.matches && t - sceneAt < .35) {
    ctx.fillStyle = 'rgba(160, 225, 196, ' + (1 - (t - sceneAt) / .35) * .5 + ')';
    ctx.fillRect(0, 0, 640, 380);
  }
}

function updateClock() {
  const phase = state.phase;
  const hours = {
    wake: 6, gymPay: 8.95, desk: 17, dream: 22.5,
    gym: 6 + 3 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.gym - state.phaseStart)),
    clinic: 9 + 8 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.clinic - state.phaseStart)),
    mine: 17 + 5 * Math.min(1, (state.elapsed - state.phaseStart) / Math.max(1, limits.mine - state.phaseStart)),
    exchange: 22, payout: 22.25, done: 22.5, yacht: 22.5
  };
  const minutes = Math.floor(hours[phase] * 60);
  const hour = Math.floor(minutes / 60);
  byId('clock').textContent = (hour % 12 || 12) + ':' + String(minutes % 60).padStart(2, '0') + (hour < 12 ? ' AM' : ' PM');
  const remaining = limits[phase] - state.elapsed;
  byId('clock').classList.toggle('glow', Boolean(trialUntil) || (remaining > 0 && remaining <= 4));
  const tick = phase + Math.ceil(remaining);
  if (remaining > 0 && remaining <= 4 && tick !== tickStamp) {
    tickStamp = tick;
    tone(330, .065, 'square', .14);
  }
}
function update(t) {
  if (titleOpen) { draw(t); requestAnimationFrame(ms => update(ms / 1000)); return; }
  walk(Math.max(0, Math.min(.05, t - lastFrame)));
  lastFrame = t;
  if (!['wake', 'done', 'yacht'].includes(state.phase)) {
    state.elapsed = Math.min(120, t - origin);
  }
  if (state.phase === 'gym') {
    if (!trialUntil && state.elapsed >= trialAt && state.elapsed < limits.gym - 3) badThoughts();
    if (trialUntil) {
      say('BAD THOUGHTS · ' + Math.max(0, Math.ceil(trialUntil - state.elapsed)) + 's · ' + affirmation);
      if (state.elapsed >= trialUntil) {
        state.failedGym = true;
        feedback(false);
        go('gymPay', 'The bad thoughts won. Kyle peed his shorts.');
      }
    }
    if (state.phase === 'gym' && state.elapsed >= limits.gym) go('gymPay');
  }
  if (state.phase === 'gymPay' && state.elapsed >= limits.gymPay) go('clinic');
  if (state.phase === 'clinic') {
    const sweep = (t * (risk ? 1.08 : .81)) % 2;
    cursor = sweep < 1 ? sweep : 2 - sweep;
    byId('needle').style.left = (cursor * 100) + '%';
    if (effect && t >= hitUntil) {
      effect = '';
      if (state.hearts && state.patients < 6) {
        patientArrives();
        say('“I’m a different guy btw.”');
      }
    }
    if (state.elapsed >= limits.clinic ||
      ((!state.hearts || state.patients >= 6) && t >= hitUntil)) go('desk');
  }
  if (state.phase === 'desk' && !monitorUntil && state.elapsed >= 90.4) enterMonitor();
  if (state.phase === 'desk' && monitorUntil && t >= monitorUntil) go('mine');
  if (state.phase === 'mine') {
    if (state.elapsed >= limits.mine) go('exchange');
    else fightTick();
  }
  if (state.phase === 'exchange') {
    exchangeTick();
    if (state.elapsed >= limits.exchange || state.elapsed - state.exchangeStart >= 2.7) finishExchange();
  }
  if (state.phase === 'dream' && t >= dreamUntil) go('done');
  soundtrack(t);
  updateClock();
  draw(t);
  requestAnimationFrame(ms => update(ms / 1000));
}

document.addEventListener('keydown', event => {
  if (titleOpen || event.target instanceof HTMLInputElement || event.ctrlKey || event.altKey || event.metaKey) return;
  if (keyDirections.has(event.code) && Object.hasOwn(stations, state.phase) && !trialUntil) {
    event.preventDefault();
    keys.add(event.code);
  }
  if (nearby === 'patient' && !event.repeat && ['Digit1', 'Digit2'].includes(event.code)) {
    event.preventDefault();
    changeRisk(event.code === 'Digit2');
  }
  if (event.code === 'KeyX' && secondary && !event.repeat) secondary();
  if (event.code === 'Space' && primary && !event.repeat) {
    event.preventDefault();
    primary();
  }
});
document.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', () => { keys.clear(); pointers.clear(); });
const stick = byId('stick');
function moveStick(event) {
  const rect = stick.getBoundingClientRect();
  const dx = event.clientX - rect.left - rect.width / 2;
  const dy = event.clientY - rect.top - rect.height / 2;
  const distance = Math.hypot(dx, dy);
  const scale = Math.min(1, 21 / Math.max(1, distance));
  byId('knob').style.transform = 'translate(' + dx * scale + 'px,' + dy * scale + 'px)';
  pointers.clear();
  if (distance < 8) return;
  if (Math.abs(dx) > distance * .35) pointers.set('horizontal', dx < 0 ? 'left' : 'right');
  if (Math.abs(dy) > distance * .35) pointers.set('vertical', dy < 0 ? 'up' : 'down');
}
stick.addEventListener('pointerdown', event => {
  event.preventDefault();
  stick.setPointerCapture(event.pointerId);
  moveStick(event);
});
stick.addEventListener('pointermove', event => {
  if (stick.hasPointerCapture(event.pointerId)) moveStick(event);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  stick.addEventListener(eventName, () => { pointers.clear(); byId('knob').style.transform = ''; });
}
byId('game-a').addEventListener('click', () => primary?.());
byId('game-b').addEventListener('click', () => secondary?.());
byId('sound').addEventListener('click', event => {
  muted = !muted;
  event.currentTarget.setAttribute('aria-pressed', muted);
  event.currentTarget.textContent = muted ? 'Unmute' : 'Mute';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
byId('start').addEventListener('click', () => {
  titleOpen = false;
  byId('title-scroll').hidden = true;
  if (window.AudioContext) audio = new AudioContext();
  audio?.resume().catch(() => {});
  origin = now() - state.elapsed;
  if (state.phase === 'wake') saySound('Time for gym.');
  renderControls();
});
state = load() || fresh();
state.fighting = false;
resetWalk();
if (state.phase === 'mine') { nearby = 'beetle'; x = 290; }
if (state.phase === 'dream') dreamUntil = now() + 1;
sceneAt = now();
origin = now() - state.elapsed;
trialAt = state.elapsed + 7 + Math.random() * 5;
renderControls();
requestAnimationFrame(ms => update(ms / 1000));
</script>
</body>
