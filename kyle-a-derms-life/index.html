<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Kyle - A Derm’s Life</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1729; color: #fff0d3; font: 16px system-ui, sans-serif; }
  main { width: min(100%, 68rem); margin: auto; padding: 12px; }
  .beta-banner { display: flex; align-items: center; gap: .65rem; background: #ffce76; color: #26172b; padding: .2rem .65rem; border-radius: 6px; font-size: .8rem; }
  .beta-banner strong { letter-spacing: .1em; }
  header { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(1rem, 3vw, 1.8rem); }
  #clock { text-align: right; min-width: 7ch; font-weight: 900; font-variant-numeric: tabular-nums; }
  #clock.glow { color: #ffe986; text-shadow: 0 0 12px #ffb34e; }
  .game { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(15rem, 1fr); gap: 10px; align-items: start; }
  canvas { width: 100%; height: auto; max-height: calc(100dvh - 86px); object-fit: contain; background: #2e243c; border-radius: 12px; }
  .panel { background: #32273f; padding: 12px; border: 1px solid #66516d; border-radius: 12px; }
  h2, p { margin: 0 0 8px; }
  h2 { font-size: 1.2rem; }
  .stats, #status { color: #dac9df; }
  #status { min-height: 1.4em; }
  [hidden] { display: none !important; }
  #movement { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; width: max-content; margin-top: 7px; touch-action: none; user-select: none; }
  #movement button { padding: 0; background: #594b69; color: #fff0d3; }
  #movement button:active { background: #877498; }
  #movement [data-move="up"] { grid-column: 2; }
  #movement [data-move="left"] { grid-column: 1; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button, input { min-height: 44px; font: inherit; border-radius: 8px; padding: 6px 10px; }
  button { border: 0; background: #ffce76; color: #26172b; font-weight: 800; touch-action: manipulation; cursor: pointer; }
  button[aria-pressed="true"] { background: #a2e3c8; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 100%; border: 2px solid #b391ad; }
  #meter { height: 18px; margin: 0 0 10px; position: relative; background: #1d1729; border-radius: 8px; overflow: hidden; }
  #zone, #needle { position: absolute; top: 0; height: 100%; }
  #zone { background: #73d4ad; }
  #needle { width: 4px; background: white; transform: translateX(-50%); }
  #exchange { color: #ffe986; font-weight: 800; }
  @media (orientation: portrait) { .game { grid-template-columns: 1fr; } }
  @media (max-height: 420px) and (orientation: landscape) {
    main { padding: 6px; }
    .panel { padding: 7px; font-size: .88rem; }
    p, h2 { margin-bottom: 5px; }
  }
  @media (max-height: 280px) {
    main.typing canvas { display: none; }
    main.typing .game { grid-template-columns: 1fr; }
  }
  main.in-mine .game { position: relative; display: block; }
  main.in-mine .panel { position: absolute; inset: auto 0 0; background: #302641ed; padding: 6px 10px; }
  main.in-mine canvas { display: block; margin: auto; max-height: calc(100dvh - 85px); }
  main.in-mine #heading { display: none; }
  main.in-mine #movement { position: absolute; right: 8px; bottom: 8px; }
  main.in-mine #stick { display: none; }
  @media (any-pointer: coarse) { main.in-mine #actions { padding-right: 103px; } }
  .top-hud { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  #cash { white-space: nowrap; font-weight: 800; color: #adf0ad; }
  #sound { min-height: 30px; font-size: .72rem; }
  #clock { display: inline-block; transition: transform .2s; transform-origin: right; }
  #clock.glow { transform: scale(1.28); }
  .scene-frame { position: relative; min-width: 0; }
  #title-scroll { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: .6rem; text-align: center; padding: 1rem; background: #211a32ed; border-radius: 12px; }
  #title-scroll p { max-width: 32ch; }
  #title-scroll h2 { color: #ffce76; font-size: clamp(1.1rem, 3vw, 2rem); }
  #movement { display: flex; align-items: center; gap: 9px; width: auto; }
  #stick { width: 74px; height: 74px; display: grid; place-items: center; border-radius: 50%; background: #483b5b; touch-action: none; user-select: none; }
  #knob { width: 34px; height: 34px; border-radius: 50%; background: #8e7da0; pointer-events: none; }
  #movement .ab { width: 44px; border-radius: 50%; background: #ffce76; color: #26172b; }
  @media (not (any-pointer: coarse)) { #movement { display: none; } }
  @media (orientation: landscape) and (max-height: 390px) {
    #stick { width: 59px; height: 59px; }
    #knob { width: 29px; height: 29px; }
    .beta-banner { margin-bottom: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { #clock { transition: none; } }
  body { background: #151a1b; color: #fbecd2; }
  main { max-width: 960px; }
  .beta-banner { background: #30342b; color: #e8d7aa; border: 1px solid #645d46; border-radius: 2px; }
  .game { grid-template-columns: 1fr; gap: 3px; }
  .scene-frame { position: relative; background: #10161b; border: 2px solid #887953; box-shadow: 0 0 0 3px #252b24; }
  canvas, main.in-mine canvas { display: block; margin: auto; border-radius: 0; max-height: calc(100dvh - 208px); image-rendering: pixelated; }
  .panel, main.in-mine .panel { position: relative; inset: auto; background: #202b2a; border: 1px solid #78816a; border-radius: 0; padding: 7px 11px; min-height: 100px; }
  #heading { color: #f0cf90; font: 800 1.05rem Georgia, serif; }
  #status, .stats { color: #e0dcc2; }
  #status { min-height: 0; }
  button, .panel button { color: #f7ead1; background: #394540; border: 1px solid #778275; border-radius: 2px; }
  button[aria-pressed="true"], #actions button:last-child:not([aria-pressed]), #continue { background: #d5b575; color: #28251d; }
  #meter { background: #151d20; border: 1px solid #927e59; border-radius: 2px; }
  #needle { background: #fff3bf; box-shadow: 0 0 4px #ea9a47; }
  #zone { background: #739a5d; }
  #dialogue { position: absolute; left: 5%; right: 5%; bottom: 5%; z-index: 2; background: #172326f5; border: 2px solid #bda373; padding: 8px 12px; box-shadow: 0 4px #121b1e; }
  #dialogue strong { color: #e6c789; }
  #dialogue p { margin: 4px 0; }
  #dialogue button { min-height: 40px; }
  main.in-mine #stick { display: grid; }
  main.in-mine #movement { position: static; }
  @media (any-pointer: coarse) and (orientation: landscape) {
    .game, main.in-mine .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(13rem, 32%); gap: 5px; }
    canvas, main.in-mine canvas { max-height: calc(100dvh - 79px); }
    .panel, main.in-mine .panel { font-size: .85rem; padding: 6px; }
    main.in-mine #actions { padding-right: 0; }
    #movement, main.in-mine #movement { position: static; }
  }
  @media (orientation: portrait) { canvas, main.in-mine canvas { max-height: none; } }

  /* The display and the lower deck use distinct, stable tracks. */
  .game, main.in-mine .game {
    display: grid;
    grid-template-columns: minmax(0, 4fr) minmax(15rem, 5fr);
    grid-template-rows: auto minmax(7.25rem, auto);
    grid-template-areas: "scene scene" "dialogue controls";
    align-items: stretch;
    gap: 6px;
  }
  .scene-frame {
    grid-area: scene;
    display: grid;
    place-items: center;
    min-width: 0;
    background: #111715;
    border: 2px solid #756952;
    border-radius: 5px 5px 13px 5px;
    box-shadow: inset 0 0 0 4px #252c27, 0 1px 0 #090d0a;
    padding: 5px 8px;
  }
  .scene-frame canvas, main.in-mine .scene-frame canvas {
    display: block;
    width: min(100%, max(16rem, calc((100dvh - 253px) * 1.6842)));
    height: auto;
    max-height: none;
    aspect-ratio: 640 / 380;
  }
  .panel, main.in-mine .panel {
    grid-area: controls;
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 3px 9px;
    align-content: center;
    padding: 6px 9px;
  }
  .panel > :not(#movement):not(.console-switches) { grid-column: 1 / -1; }
  .panel #heading, .panel #status, .panel .stats, .panel #exchange { margin: 0; }
  .panel #meter { margin: 0 0 2px; }
  .panel #actions { gap: 4px; }
  .console-switches {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }
  .console-readout { align-self: center; margin-right: auto; min-width: 0; }
  .console-switches #sound { align-self: center; min-height: 33px; }
  main.in-mine #heading { display: block; }
  .game:has(#title-scroll[hidden]) #start { display: none; }
  .game:has(#title-scroll:not([hidden])) .panel > :not(.console-switches) { display: none !important; }
  .game:has(#title-scroll:not([hidden])) .console-switches { justify-content: center; }
  .game:has(#title-scroll:not([hidden])) .console-readout,
  .game:has(#title-scroll:not([hidden])) .dialogue-dock #status,
  .dialogue-dock:has(#dialogue:not([hidden])) #status { display: none; }
  .dialogue-dock > #status { padding: 8px 10px; margin: 0; font-size: .86rem; }
  .dialogue-dock {
    grid-area: dialogue;
    min-width: 0;
    min-height: 6.5rem;
    background: #17211e;
    border: 1px solid #475644;
    border-radius: 3px;
    box-shadow: inset 0 1px 5px #0c1212;
  }
  #dialogue {
    position: static;
    height: 100%;
    padding: 7px 9px;
    border: 1px solid #bda373;
    background: #172326;
    box-shadow: none;
    display: grid;
    grid-template: "speaker button" auto "speech button" 1fr / minmax(0, 1fr) auto;
    column-gap: 8px;
    align-items: center;
    overflow: auto;
    scrollbar-width: thin;
  }
  #dialogue #speaker { grid-area: speaker; font: 800 .93rem Georgia, serif; }
  #dialogue #speech {
    grid-area: speech;
    margin: 3px 0 0;
    font-size: .9rem;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  #dialogue #continue {
    grid-area: button;
    min-height: 44px;
    padding: 5px 8px;
    max-width: 7.5rem;
    justify-self: end;
    font-size: .79rem;
    line-height: 1.15;
  }
  @media (any-pointer: coarse) {
    body { background: #23232b; }
    main {
      border: 1px solid #84838f;
      border-radius: 12px 12px 28px 12px;
      background: linear-gradient(145deg, #aaaab2, #848692);
      box-shadow: 0 3px 0 #4e515a, inset 0 2px #c5c4cc;
      padding: 5px 8px 8px;
    }
    .beta-banner {
      color: #2a2950;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0 0 2px;
      font-size: .72rem;
    }
    header { margin-bottom: 3px; }
    header h1 { font-size: clamp(.94rem, 2.5vw, 1.35rem); color: #211f40; }
    #cash { color: #202943; }
    #clock { color: #252441; font-size: .9rem; }
    #clock.glow { color: #5d344f; text-shadow: 0 0 8px #f8e3a5; }
    .scene-frame {
      border: 2px solid #535266;
      border-radius: 8px 8px 16px 8px;
      padding: 4px;
      background: #292b3a;
      box-shadow: inset 0 0 0 3px #343647;
    }
    .panel, main.in-mine .panel {
      background: #797c8d;
      border-color: #606273;
      border-radius: 5px 5px 16px 5px;
      box-shadow: inset 0 1px #a9abb4;
      padding: 4px 6px;
    }
    .panel #heading, .panel #status, .panel .stats, .panel #exchange { color: #18182b; }
    .panel #heading { font: 800 .82rem Georgia, serif; }
    .panel #status, .panel .stats, .panel #exchange { font-size: .76rem; line-height: 1.2; }
    .panel button { min-height: 44px; padding: 4px 6px; font-size: .78rem; }
    .panel #actions button { flex: 1 1 0; min-width: 0; }
    .panel #sound { min-height: 30px; color: #eeedf7; background: #474959; }
    #movement, main.in-mine #movement {
      grid-column: 2;
      grid-row: 1 / span 5;
      position: static;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 4px;
      align-content: center;
      width: min-content;
      min-width: 100px;
      margin: 0;
      padding: 2px;
    }
    #movement .ab {
      width: 44px;
      min-height: 44px;
      color: #f9e6ef;
      background: #782953;
      border: 1px solid #522343;
      box-shadow: 0 2px #382339, inset 0 1px #ad5787;
      font-size: .95rem;
    }
    #movement #stick {
      width: 48px;
      height: 48px;
      margin: 0 24px 2px;
      background: #454653;
      border: 1px solid #363745;
      box-shadow: inset 0 2px 5px #2f303d;
    }
    @media (min-width: 680px) {
      #movement, main.in-mine #movement { flex-wrap: nowrap; width: max-content; }
      #movement #stick { margin: 0 3px 0 0; }
    }
    #movement #knob {
      width: 24px;
      height: 24px;
      background: #686a7c;
      box-shadow: 0 1px 2px #2a2a37, inset 0 1px #9395a6;
    }
    .panel:has(#movement:not([hidden])) > :not(#movement) {
      grid-column: 1;
    }
  }
  @media (orientation: landscape) and (max-height: 460px) {
    .game, main.in-mine .game {
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      grid-template-rows: auto minmax(5.7rem, auto);
      gap: 3px;
    }
    .dialogue-dock { min-height: 5.7rem; }
    .scene-frame canvas, main.in-mine .scene-frame canvas {
      width: min(100%, max(13rem, calc((100dvh - 202px) * 1.6842)));
    }
    #dialogue { padding: 4px 6px; }
    #dialogue #speaker { font-size: .82rem; }
    #dialogue #speech, .dialogue-dock > #status { font-size: .8rem; }
    #dialogue #continue { max-width: 5rem; font-size: .72rem; }
    #title-scroll { gap: 3px; padding: 6px; }
    #title-scroll p { font-size: .85rem; }
  }
  @media (orientation: portrait) and (max-width: 47rem) {
    .game, main.in-mine .game {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(6.5rem, auto) auto;
      grid-template-areas: "scene" "dialogue" "controls";
    }
    .scene-frame canvas, main.in-mine .scene-frame canvas { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <p class="beta-banner"><strong>BETA</strong><span id="day-label">DAY 1 / 5</span></p>
  <header><h1>Kyle - A Derm’s Life</h1><div class="top-hud"><span id="cash" aria-label="Yacht fund">$0</span><time id="clock">6:00 AM</time></div></header>
  <div class="game">
    <div class="scene-frame">
      <canvas id="scene" width="640" height="380" role="img" aria-label="Kyle’s bedroom"></canvas>
      
      <div id="title-scroll">
        <h2>Kyle - A Derm’s Life</h2>
        <p>Five days to make $1,100 and buy a yacht. Fall short and it’s back to the bedroom as a full-time streamer.</p>
        
      </div>
    </div>
    <div class="dialogue-dock">
      <section id="dialogue" hidden aria-live="polite"><strong id="speaker"></strong><p id="speech"></p><button id="continue" type="button">Continue · A / Space</button></section>
      <p id="status" aria-live="polite"></p>
    </div>
    <section class="panel" aria-labelledby="heading">
      <div class="console-switches"><div class="console-readout"><h2 id="heading"></h2><p class="stats" id="stats"></p></div><button id="start" type="button">Start Day 1</button><button id="sound" type="button" aria-pressed="false">Mute</button></div>
      
      
      
      <div id="meter" hidden aria-label="Hit the green zone"><span id="zone"></span><span id="needle"></span></div>
      <p id="exchange" hidden aria-live="polite"></p>
      <div id="actions"></div>
      <div id="movement" aria-label="Game controls">
        <div id="stick" aria-label="Movement joystick"><span id="knob"></span></div>
        <button class="ab" id="game-a" type="button" aria-label="A, interact">A</button>
        <button class="ab" id="game-b" type="button" aria-label="B, back or use item">B</button>
      </div>
    </section>
  </div>
</main>

function npc(index, x, foot, height, tint = false) {
  const sprite = npcSprites[index];
  if (!sprite.naturalHeight) return;
  const width = sprite.naturalWidth * height / sprite.naturalHeight;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (tint) ctx.filter = 'sepia(.5) saturate(2.2) hue-rotate(330deg)';
  ctx.drawImage(sprite, x - width / 2, foot - height, width, height);
  ctx.restore();
}

function talk(name, words, next, hold = .35) {
  dialogue = { at: now(), next, hold };
  keys.clear();
  pointers.clear();
  walking = false;
  byId('speaker').textContent = name;
  byId('speech').textContent = words;
  byId('dialogue').hidden = false;
  byId('continue').focus();
}
function advance() {
  if (!dialogue || now() - dialogue.at < dialogue.hold) return;
  const { next } = dialogue;
  lastFrame = now();
  dialogue = null;
  byId('dialogue').hidden = true;
  next?.();
}
function greet() {
  patientArrives();
  say('Patient ' + (state.patients + 1) + ' of ' + patientLimit + ' · “I’m a different guy btw.”');
}

let audio;
const mobile = matchMedia('(any-pointer: coarse)');
const equipment = ['Combat boots', 'Shield', 'Mace', 'Sword of Truth', 'Holy Water'];

function tone(hz, duration, wave = 'sine', volume = .06, offset = 0) {
  if (!audio || muted || audio.state !== 'running') return;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const start = audio.currentTime + offset;
  oscillator.type = wave;
  oscillator.frequency.value = hz;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(.001, start + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start + duration);
}
function saySound(words, rate = 1) {
  if (muted || !audio || !('speechSynthesis' in window)) return;
  const voice = new SpeechSynthesisUtterance(words);
  voice.rate = rate;
  voice.volume = .35;
  speechSynthesis.speak(voice);
}
function feedback(success) {
  if (success) {
    streak++;
    tone(370, .1, 'triangle');
    tone(880, .23, 'sine', .09, .08);
    if (streak % 5 === 0) saySound('Nice!');
  } else {
    streak = 0;
    tone(92, .18, 'triangle', .13);
    tone(70, .23, 'triangle', .12, .15);
  }
}
function soundtrack(t) {
  const music = {
    gym: [[82, 82, 98, 74, 82, 110, 98, 74], 'sawtooth', .24, .022],
    clinic: [[262, 330, 392, 440, 349, 330, 294, 392], 'triangle', .33, .033],
    mine: [[392, 440, 523, 587, 523, 440, 349, 392], 'sine', .46, .045]
  }[state.phase];
  if (!music) return;
  const [notes, wave, spacing, volume] = music;
  const beat = Math.floor((t - sceneAt) / spacing);
  if (beat === musicBeat) return;
  musicBeat = beat;
  tone(notes[Math.max(0, beat) % notes.length], spacing * .88, wave, volume);
}

let trialUntil = 0;
let trialAt;
let cursor = 0;
let target = .5;
let risk = false;
let recoveryUntil = 0;
let hitUntil = 0;
let effect = '';
let lastExchangeStep = -1;

function fresh() {
  return { phase: 'wake', day: 1, elapsed: 0, cash: 0, gymPay: 0, reps: 0, failedGym: false,

    playerHp: 24, enemyHp: 18 };

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    return saved && Object.hasOwn(labels, saved.phase) ? saved : null;
  } catch { return null; }
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
}

function resetWalk() {
  x = starts[state.phase] ?? 244;
  y = 244;
  facing = 1;
  walking = false;
  nearby = null;
  keys.clear();
  pointers.clear();
}

function walk(dt) {
  const available = stations[state.phase];
  if (!available || monitorUntil || dialogue || trialUntil || titleOpen || lifting || clinicActive || loot) return;
  const directions = new Set(pointers.values());
  for (const key of keys) directions.add(keyDirections.get(key));
  const dx = Number(directions.has('right')) - Number(directions.has('left'));
  const dy = Number(directions.has('down')) - Number(directions.has('up'));
  const length = Math.hypot(dx, dy);
  walking = length > 0;
  if (walking) {
    if (dx) facing = dx;
    aim = { x: dx / length, y: dy / length };
    x = Math.max(52, Math.min(591, x + dx * 218 * dt / length));
    y = Math.max(202, Math.min(320, y + dy * 160 * dt / length));
  }
  if (state.phase === 'mine') return;
  let closest = null;
  let radius = 50;
  for (const station of available) {
    const distance = Math.hypot(x - station.x, y - station.y);
    if (distance < radius) {
      radius = distance;
      closest = station.id;
    }
  }
  if (nearby === closest) return;
  nearby = closest;
  if (nearby === 'squat' || nearby === 'bench') state.exercise = nearby === 'squat' ? 'Squat' : 'Bench';
  renderControls();
}

function button(label, action, { main = false, pressed, disabled = false } = {}) {
  const element = document.createElement('button');
  element.type = 'button';
  element.textContent = label;
  element.disabled = disabled;
  if (pressed !== undefined) element.setAttribute('aria-pressed', pressed);
  element.addEventListener('click', () => { if (!dialogue) action(); });
  if (action === cut) {
    element.addEventListener('pointerdown', () => { if (!dialogue) pointerCursor = cursor; });
    element.addEventListener('pointercancel', () => { pointerCursor = NaN; });
  }
  byId('actions').append(element);
  if (main && !disabled) primary = action;
}
function say(message) { byId('status').textContent = message; }
function refreshStats() {
  const details = {
    gym: state.reps + ' reps',
    clinic: '♥'.repeat(state.hearts) + '♡'.repeat(3 - state.hearts),
    mine: 'Lv. ' + state.level + ' · ' + state.gear + ' · ' + state.gold + ' gold'
  };
  byId('cash').textContent = dollars(state.cash);
  byId('cash').setAttribute('aria-label', 'Yacht fund, ' + dollars(state.cash) + ' of ' + dollars(yachtPrice));
  const dayLabel = byId('day-label');
  if (dayLabel) dayLabel.textContent = 'DAY ' + state.day + ' / ' + daysToPlay;
  byId('stats').textContent = details[state.phase] || '';
  byId('stats').hidden = !details[state.phase];
}
function go(phase, message) {
  state.phase = phase;
  state.elapsed = 0;
  lastFrame = now();
  tickStamp = '';
  sceneAt = now();
  musicBeat = -1;
  lifting = false;
  clinicActive = false;
  loot = null;
  monitorUntil = 0;
  if (phase === 'dream') dreamUntil = now() + 1;
  resetWalk();
  if (phase === 'mine') resetArena();
  if (phase === 'payout') heardPayout = false;
  trialUntil = 0;
  hitUntil = 0;
  recoveryUntil = 0;
  effect = '';
  if (phase === 'gym') trialAt = 5 + Math.random() * 4;
  if (phase === 'clinic') { risk = false; target = .5; pointerCursor = NaN; }
  if (phase === 'exchange') lastExchangeStep = -1;
  if (phase === 'gymPay') {
    state.gymPay = state.failedGym || state.reps < 6 ? gymPay.low : state.reps >= 14 ? gymPay.high : gymPay.medium;
    state.cash += state.gymPay;
  }
  renderControls(message);
  save();
  if (phase === 'gymPay') talk('Gym regular', byId('status').textContent, () => go('clinic'));
  if (phase === 'exchange') talk('Kyle', 'I need to convert this to dollars. Good thing there’s a way.', () => { sceneAt = now(); exchangeTick(); });
}

function renderControls(message) {
  const p = state.phase;
  document.querySelector('main').classList.remove('typing');
  document.querySelector('main').classList.toggle('in-mine', p === 'mine');
  byId('heading').textContent = labels[p];
  canvas.setAttribute('aria-label', labels[p] + ' cartoon scene');
  byId('actions').replaceChildren();
  byId('meter').hidden = !clinicActive;
  byId('movement').hidden = titleOpen || (!Object.hasOwn(stations, p) && p !== 'gymPay');
  byId('exchange').hidden = p !== 'exchange';
  primary = null;
  secondary = null;
  refreshStats();
  if (p === 'wake') {
    const input = matchMedia('(any-pointer: coarse)').matches ? 'Use the joystick.' : 'Use WASD or the arrow keys.';
    say('Kyle: “Time for gym.” Walk to the gym door. ' + input);
    if (nearby === 'gym') button('Enter gym', () => go('gym'), { main: true });
  }
  if (p === 'gym') {
    say(message || 'Walk up to the squat rack or bench.');
    if (nearby === 'squat' || nearby === 'bench') {
      if (lifting) {
        say(message || state.exercise + ' · Tap A or Space for each rep.');
        button('Lift', lift, { main: true });
        secondary = () => { lifting = false; renderControls(); };
        button('Step off', secondary);
      } else button(state.exercise, () => { lifting = true; tone(180, .1, 'triangle'); renderControls(); }, { main: true });
    }
    if (nearby === 'clinic') button('Finish workout', () => go('gymPay'), { main: true });
  }
  if (p === 'gymPay') {
    const line = state.gymPay === gymPay.high ? 'Hey, kid. Looking big today.'
      : state.gymPay === gymPay.medium ? 'You’re getting there, kid.'
      : 'Looking small today, kid. Best I can do.';
    say((message ? message + ' ' : '') + '“' + line + '” +' + dollars(state.gymPay));
    button('Clock in', () => go('clinic'), { main: true });
  }
  if (p === 'clinic') {
    say(message || 'Walk up to the patient chair.');
    if (nearby === 'patient' && !clinicActive) button('See patients', () => {
      clinicActive = true;
      renderControls();
      greet();
    }, { main: true });
    if (clinicActive) {
      say(message || 'Patient ' + (state.patients + 1) + ' of ' + patientLimit + ' · Cut in the green zone.');
      button('Easy · ' + dollars(cutPay.easy), () => changeRisk(false), { pressed: !risk });
      button('Hard · ' + dollars(cutPay.hard), () => changeRisk(true), { pressed: risk });
      button('Cut', cut, { main: true });
      secondary = () => { clinicActive = false; renderControls(); };
      updateZone();
    }
    if (nearby === 'home') button('Go home', () => go('desk'), { main: true });
  }
  if (p === 'desk') {
    say('Walk to the desk to play MineScape.');
    if (nearby === 'pc') button('Play MineScape', enterMonitor, { main: true });
  }
  if (p === 'mine') {
    if (loot) {
      say('You did it! The brave warrior gets ' + loot + '.');
      button('✓ Equip', equipLoot, { main: true });
    } else {
      say(message || 'Move to dodge. Face the beetle and swing. B or X eats a pear.');
      button('Swing', startFight, { main: true });
      button('Eat pear', eat);
      secondary = eat;
      button('Cash out', () => go('exchange'));
    }
  }
  if (p === 'exchange') {
    say('Kyle: “I need to convert this to dollars. Good thing there’s a way.”');
    byId('exchange').textContent = state.gold + ' MineScape gold';
  }
  if (p === 'dream') say(dayOnPace() ? 'Kyle dreams of the yacht.' : 'Kyle dreams he’s working the fryer.');
  if (p === 'done' || p === 'yacht' || p === 'streamer') {
    say(p === 'yacht' ? 'Kyle sails off into the Jacksonville sunset.'
      : p === 'streamer' ? 'Kyle’s first Twitch subscriber was xSgtMelonx.'
      : 'Day ' + state.day + ' complete. ' + dollars(state.cash) + ' of ' + dollars(yachtPrice) + ' saved.');
    if (p === 'done' && state.cash >= yachtPrice) button('Buy yacht', buyYacht, { main: true });
    if (p === 'done' && state.day < daysToPlay) button('Start day ' + (state.day + 1), nextDay, { main: state.cash < yachtPrice });
    if (p === 'done' && state.day === daysToPlay && state.cash < yachtPrice) button('See what happens to Kyle', () => go('streamer'), { main: true });
    if (p !== 'done') button('New game', restart, { main: true });
    const back = document.createElement('a');
    back.href = '../';
    back.textContent = 'Back to Arcade';
    byId('actions').append(back);
  }
}

function lift() {
  const t = now();
  if (trialUntil || dialogue || t - repAt < .46) return;
  repAt = t;
  state.reps++;
  tone(110, .08, 'triangle', .1);
  feedback(true);
  refreshStats();
}
function badThoughts() {
  trialUntil = Math.min(state.elapsed + 4.5, limits.gym);
  trialAt = Infinity;
  keys.clear();
  pointers.clear();
  walking = false;
  byId('actions').replaceChildren();
  primary = null;
  secondary = null;
  button(affirmation, finishAffirmation, { main: true });
}
function finishAffirmation() {
  trialUntil = 0;
  feedback(true);
  renderControls('You shook it off. Back to lifting.');
}
function patientArrives() {
  tone(104, .16, 'triangle', .06);
  tone(89, .16, 'triangle', .05, .12);
  tone(118, .19, 'triangle', .06, .25);
}
function changeRisk(value) {
  risk = value;
  renderControls();
  byId('actions').querySelector('[aria-pressed="true"]').focus();
}
function zoneWidth() { return risk ? .15 : .32; }
function updateZone() {
  byId('zone').style.left = ((target - zoneWidth() / 2) * 100) + '%';
  byId('zone').style.width = (zoneWidth() * 100) + '%';
}
function cut() {
  const displayed = Number.isFinite(pointerCursor) ? pointerCursor : cursor;
  pointerCursor = NaN;
  if (dialogue || !clinicActive || !state.hearts || state.patients >= patientLimit) return;
  state.patients++;
  const tolerance = 6 / Math.max(1, byId('meter').clientWidth);
  const success = Math.abs(displayed - target) <= zoneWidth() / 2 + tolerance;
  effect = success ? '✓' : 'I’m leaving!';
  hitUntil = now() + 100;
  reactionAt = now();
  feedback(success);
  if (success) state.cash += risk ? cutPay.hard : cutPay.easy;
  else state.hearts--;
  refreshStats();
  talk('Clinic', success ? 'Clean cut. +' + dollars(risk ? cutPay.hard : cutPay.easy)
    : state.hearts ? 'The patient storms out. One heart lost.' : 'Your last patient storms out. Shift over.', () => {
      effect = '';
      hitUntil = 0;
      if (!state.hearts || state.patients >= patientLimit) { go('desk'); return; }
      target = .26 + Math.random() * .48;
      updateZone();
      greet();
    }, .4);
}
function enterMonitor() {
  if (monitorUntil) return;
  monitorUntil = now() + (motion.matches ? .03 : .6);
  say('Kyle settles in at the computer.');
  byId('actions').replaceChildren();
  primary = null;
}
function resetArena() {
  x = 205;
  aim = { x: 1, y: 0 };
  swing = null;
  spawnBeetle();
}
function spawnBeetle() {
  enemy = { x: x < 320 ? 510 : 133, y: 242, windup: 0, recover: state.elapsed + .6, flash: 0 };
}
function startFight() {
  if (dialogue || loot || swing || state.playerHp <= 0) return;
  swing = { at: state.elapsed, x: aim.x, y: aim.y, checked: false };
  tone(165, .15, 'triangle', .07);
}
function eat() {
  if (dialogue || state.playerHp <= 0 || state.playerHp >= 24 || now() < recoveryUntil) return;
  state.playerHp = Math.min(24, state.playerHp + 7);
  recoveryUntil = now() + 2;
  tone(280, .12, 'triangle', .08);
  say('Kyle eats a cave pear.');
}
function fightTick(dt) {
  const dx = enemy.x - x;
  const dy = enemy.y - y;
  const distance = Math.hypot(dx, dy);
  if (swing) {
    const age = state.elapsed - swing.at;
    if (age >= .13 && !swing.checked) {
      swing.checked = true;
      const aimed = distance < 12 || (dx * swing.x + dy * swing.y) / distance > .3;
      if (state.gearItems.includes('Holy Water') || (distance <= 88 && aimed)) {
        state.enemyHp -= state.gearItems.includes('Holy Water') ? state.enemyHp : state.gearItems.includes('Sword of Truth') ? 15 : state.gearItems.includes('Mace') ? 12 : 8;
        enemy.flash = state.elapsed + .2;
        enemy.windup = 0;
        enemy.recover = state.elapsed + .43;
        feedback(true);
        if (state.enemyHp <= 0) {
          state.mineWins++;
          if (state.mineWins <= 3) state.gold += goldPerWin;
          swing = null;
          if (!state.earnedToday && state.gearItems.length < equipment.length) {
            loot = equipment[state.gearItems.length];
            talk('MineScape', 'You found ' + loot + '.', equipLoot, .65);
          } else {
            state.enemyHp = enemyMaxHp();
            spawnBeetle();
            say(state.mineWins <= 3 ? '+125 gold. Another beetle approaches.' : 'New beetle. Tonight’s gold limit is reached.');
            save();
          }
          refreshStats();
          return;
        }
      }
    }
    if (age >= .38) swing = null;
  }
  if (enemy.windup) {
    if (state.elapsed < enemy.windup) return;
    enemy.windup = 0;
    enemy.recover = state.elapsed + .78;
    if (distance < 68) {
      state.playerHp -= state.gearItems.includes('Shield') ? 3 : 4;
      feedback(false);
      if (state.playerHp <= 0) go('exchange');
    }
  } else if (state.elapsed >= enemy.recover) {
    if (distance < 57) enemy.windup = state.elapsed + .52;
    else {
      enemy.x -= dx / distance * 85 * dt;
      enemy.y -= dy / distance * 68 * dt;
    }
  }
}
function enemyMaxHp() {
  return 17 + state.day;
}
function equipLoot() {
  if (!loot || state.earnedToday) return;
  state.gear = loot;
  state.gearItems.push(loot);
  state.level++;
  state.earnedToday = true;
  gearFlight = { item: loot, at: now() };
  loot = null;
  state.enemyHp = enemyMaxHp();
  spawnBeetle();
  renderControls('Equipped ' + state.gear + ' · One new item per night.');
  save();
}
function exchangeTick() {
  const i = exchangeSteps.findIndex(step => state.elapsed < step.until);
  const step = i < 0 ? exchangeSteps.length - 1 : i;
  if (step === lastExchangeStep) return;
  lastExchangeStep = step;
  const values = [
    state.gold.toLocaleString() + ' gold',
    (state.gold * 2).toLocaleString() + ' bolívares',
    dollars(Math.floor(state.gold / 5)) + ' USD'
  ];
  byId('exchange').textContent = exchangeSteps[step].chapter + ' · ' + values[step];
  say(exchangeSteps[step].text);
  tone(step === 2 ? 520 : 300 + step * 70, .12, 'triangle');
}
function finishExchange() {
  state.cash += Math.floor(state.gold / 5);
  state.gold = 0;
  go('dream');
}
function buyYacht() {
  if (state.cash < yachtPrice) return;
  state.cash -= yachtPrice;
  go('yacht');
}
function dayOnPace() {
  return state.cash >= yachtPrice * state.day / daysToPlay;
}
function beginMorning() {
  repAt = -Infinity;
  streak = 0;
  gearFlight = null;
  go('wake');
  talk('Kyle', 'Time for gym.');
}
function nextDay() {
  if (state.day >= daysToPlay || state.phase !== 'done') return;
  const {day, cash, level, gear, gearItems} = state;
  state = { ...fresh(), day: day + 1, cash, level, gear, gearItems };
  state.enemyHp = enemyMaxHp();
  beginMorning();
}
function restart() {
  state = fresh();
  beginMorning();
}

function shape(points, fill) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.stroke();
}
function box(x, y, w, h, color, radius = 5) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.stroke();
}
function oval(x, y, w, h, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.stroke();
}
function line(points) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.stroke();
}
function caption(text, x, y, size = 22, color = '#fff1da') {
  ctx.font = '900 ' + size + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function kyle(x, y, scale, outfit, upset = false, flex = false, direction = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * direction, scale);
  const skin = '#f7ae81';
  const coat = outfit === 'home' ? '#528d96' : '#fff5df';
  if (kyleSprite.naturalWidth) {
    const ratio = 190 / kyleSprite.naturalHeight;
    ctx.imageSmoothingEnabled = false;
    ctx.translate(-kyleSprite.naturalWidth * ratio / 2, -85);
    ctx.scale(ratio, ratio);
    if (outfit === 'yacht' && flex) {

  event.currentTarget.textContent = muted ? 'Unmute' : 'Mute';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
byId('start').addEventListener('click', () => {
  titleOpen = false;
  byId('title-scroll').hidden = true;
  if (window.AudioContext) audio = new AudioContext();
  audio?.resume().catch(() => {});
  lastFrame = now();
  if (state.phase === 'wake') {
    saySound('Time for gym.');
    talk('Kyle', 'Time for gym.');
  }
  if (state.phase === 'gymPay') talk('Gym regular', byId('status').textContent, () => go('clinic'));
  if (state.phase === 'exchange') talk('Kyle', 'I need to convert this to dollars. Good thing there’s a way.', () => { sceneAt = now(); exchangeTick(); });
  renderControls();
});
const savedCampaign = load();
state = savedCampaign || fresh();
if (savedCampaign) byId('start').textContent = 'Resume Day ' + state.day;
resetWalk();
if (state.phase === 'mine') resetArena();
if (state.phase === 'dream') dreamUntil = now() + 1;
sceneAt = now();
lastFrame = now();
trialAt = state.elapsed + 5 + Math.random() * 4;
renderControls();
document.addEventListener('visibilitychange', () => { lastFrame = now(); keys.clear(); pointers.clear(); });
requestAnimationFrame(ms => update(ms / 1000));
</script>
</body>
</html>
